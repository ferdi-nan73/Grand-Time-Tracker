<script>
/* ============================================================
   GTT v1.0.0-Beta.1 — PATROL UI ROUTING PATCH
   ADDITIVE ONLY. Tidak mengganti/menimpa fungsi existing.
   ============================================================ */
(function () {
  'use strict';

  function formatPatrolDateBeta1_() {
    try {
      return new Intl.DateTimeFormat('id-ID', {
        timeZone: 'Asia/Makassar',
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      }).format(new Date());
    } catch (error) {
      return new Date().toLocaleDateString('id-ID');
    }
  }

  function syncPatrolIdentityBeta1_() {
    const date = document.getElementById('patrolCurrentDate');
    const name = document.getElementById('patrolEmployeeName');
    const summary = document.getElementById('patrolEmployeeSummary');
    const profileName = document.getElementById('profileName');
    const profileSummary = document.getElementById('profileSummary');

    if (date) date.textContent = formatPatrolDateBeta1_();
    if (name && profileName) name.textContent = profileName.textContent || 'Nama Karyawan';
    if (summary && profileSummary) summary.textContent = profileSummary.textContent || 'Jabatan · Outlet';
  }

  function openPatrolBeta1_() {
    const patrolView = document.getElementById('saPatrolView');
    if (!patrolView) return;

    document.querySelectorAll('.sa-tab-view').forEach(view => {
      const active = view === patrolView;
      view.classList.toggle('active', active);
      view.hidden = !active;
    });

    document.querySelectorAll('[data-sa-tab]').forEach(button => {
      const active = button.dataset.saTab === 'patrol';
      button.classList.toggle('active', active);
      if (active) {
        button.setAttribute('aria-current', 'page');
      } else {
        button.removeAttribute('aria-current');
      }
    });

    const pulangButton = document.getElementById('saPulangButton');
    if (pulangButton) {
      pulangButton.hidden = true;
      pulangButton.setAttribute('aria-hidden', 'true');
    }

    syncPatrolIdentityBeta1_();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function bindPatrolNavigationBeta1_() {
    document.addEventListener('click', event => {
      const button = event.target && event.target.closest
        ? event.target.closest('[data-sa-tab="patrol"]')
        : null;

      if (!button) return;

      event.preventDefault();
      event.stopImmediatePropagation();
      openPatrolBeta1_();
    }, true);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindPatrolNavigationBeta1_, { once: true });
  } else {
    bindPatrolNavigationBeta1_();
  }
})();
</script>

<script>
/* ============================================================
   GTT v1.0.0-Beta.2 — SA DAILY ACTIVITY
   Additive isolated runtime module.
   ============================================================ */
(function () {
  'use strict';

  const ACT_VERSION = 'v1.0.0-Beta.2';
  const MAX_ROUTE_STOPS = 10;
  const REFRESH_VISIBLE_MS = 30000;
  const REFRESH_PENDING_MS = 8000;

  const act = {
    initialized: false,
    busy: false,
    data: null,
    fetchedAtMs: 0,
    serverOffsetMs: 0,
    lastPin: '',
    lastAttemptPin: '',
    lastAttemptAtMs: 0,
    bootstrapInFlight: false,
    bootstrapError: '',
    bootstrapFailureCount: 0,
    editMode: false,
    pollingId: null,
    sessionWatchId: null,
    tickId: null,
    homeObserversBound: false,
    modalResolve: null
  };

  function esc_(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function normalizeServerResult_(result) {
    if (typeof result !== 'string') return result;
    const text = result.trim();
    if (!text) return null;
    try {
      return JSON.parse(text);
    } catch (error) {
      throw new Error('Respons Activity bukan JSON valid.');
    }
  }

  function api_(method, args) {
    return new Promise((resolve, reject) => {
      if (
        typeof google === 'undefined' ||
        !google.script ||
        !google.script.run
      ) {
        reject(new Error('GTT harus dibuka dari URL Web App.'));
        return;
      }

      const runner = google.script.run
        .withSuccessHandler(result => {
          try {
            resolve(normalizeServerResult_(result));
          } catch (error) {
            reject(error);
          }
        })
        .withFailureHandler(error => {
          const message = error && error.message ? error.message : 'Komunikasi Activity dengan server gagal.';
          reject(new Error(message));
        });

      if (!runner[method]) {
        reject(new Error('API ' + method + ' tidak tersedia.'));
        return;
      }

      runner[method](...(args || []));
    });
  }

  function currentPin_() {
    try {
      return String(state && state.pin || '').trim();
    } catch (error) {
      return '';
    }
  }

  function currentUser_() {
    try {
      return state && state.user ? state.user : null;
    } catch (error) {
      return null;
    }
  }

  function feedback_(message, type) {
    const text = String(message || '').trim();
    if (!text) return;

    try {
      if (typeof showSaActionFeedback === 'function') {
        showSaActionFeedback(text, type || 'info');
        return;
      }
    } catch (ignore) {}

    if (type === 'error' || type === 'warning') {
      console.warn(text);
    } else {
      console.log(text);
    }
  }

  function setBusy_(busy) {
    act.busy = Boolean(busy);
    document.querySelectorAll('#gttActWorkspace button, #gttActWorkspace select, #gttActWorkspace textarea, #gttActWorkspace input')
      .forEach(el => {
        if (el.dataset.keepEnabled === 'true') return;
        el.disabled = act.busy;
      });
  }

  function ensureWorkspace_() {
    if (document.getElementById('gttActWorkspace')) return;
    const view = document.getElementById('saOutsideDutyView');
    if (!view) return;

    const legacy = view.querySelector('.outside-duty-module');
    if (legacy) {
      legacy.hidden = true;
      legacy.setAttribute('aria-hidden', 'true');
    }

    const workspace = document.createElement('div');
    workspace.id = 'gttActWorkspace';
    workspace.innerHTML = `
      <section id="gttActMainSection" class="gtt-act-section" aria-live="polite">
        <div class="gtt-act-status-strip">
          <div class="gtt-act-status-cell"><span>Status Activity</span><strong>Menunggu sesi...</strong></div>
          <div class="gtt-act-status-cell"><span>GTT Version</span><strong>${esc_(ACT_VERSION)}</strong></div>
        </div>
      </section>
      <section id="gttActApprovalQueue" class="gtt-act-section" hidden></section>
      <div id="gttActInfoGrid" class="gtt-act-info-grid"></div>
      <section id="gttActOutletSummary" class="gtt-act-section gtt-act-summary-section" aria-live="polite"></section>

      <div id="gttActModal" class="gtt-act-modal" hidden aria-hidden="true">
        <div class="gtt-act-modal-card" role="dialog" aria-modal="true" aria-labelledby="gttActModalTitle">
          <h3 id="gttActModalTitle">Konfirmasi</h3>
          <p id="gttActModalMessage"></p>
          <div class="gtt-act-modal-actions">
            <button id="gttActModalCancel" class="gtt-act-btn gtt-act-btn-neutral" type="button">BATAL</button>
            <button id="gttActModalOk" class="gtt-act-btn gtt-act-btn-primary" type="button">YA</button>
          </div>
        </div>
      </div>
    `;

    if (legacy) {
      view.insertBefore(workspace, legacy);
    } else {
      const homeButton = view.querySelector('.menu-home-button');
      view.insertBefore(workspace, homeButton || null);
    }

    bindWorkspaceEvents_();
  }

  function ensureVersionModule_() {
    const pinRow = document.querySelector('#saProfileView .gtt-status-pin-row');
    if (!pinRow || document.getElementById('gttActVersionCell')) return;

    const parent = pinRow.parentNode;
    if (!parent) return;

    const grid = document.createElement('div');
    grid.className = 'gtt-act-status-version-grid';
    grid.id = 'gttActStatusVersionGrid';
    parent.insertBefore(grid, pinRow);
    grid.appendChild(pinRow);

    const versionCell = document.createElement('div');
    versionCell.id = 'gttActVersionCell';
    versionCell.className = 'gtt-act-version-cell';
    versionCell.innerHTML = `<span>GTT VERSION</span><strong>${esc_(ACT_VERSION)}</strong>`;
    grid.appendChild(versionCell);

    const hiddenVersion = document.getElementById('profileAppVersion');
    if (hiddenVersion) hiddenVersion.textContent = ACT_VERSION;
  }

  function bindWorkspaceEvents_() {
    const workspace = document.getElementById('gttActWorkspace');
    if (!workspace || workspace.dataset.bound === 'true') return;
    workspace.dataset.bound = 'true';

    workspace.addEventListener('click', async event => {
      const button = event.target.closest('[data-gtt-act]');
      if (!button || act.busy) return;
      const action = button.dataset.gttAct;

      try {
        if (action === 'add-route') addRouteRow_();
        if (action === 'remove-route') removeRouteRow_(button);
        if (action === 'submit-request') await submitRequest_();
        if (action === 'start-task') await startTask_();
        if (action === 'finish-task') await finishTask_();
        if (action === 'cancel-task') await cancelTask_();
        if (action === 'edit-task') beginEditCurrentTask_();
        if (action === 'cancel-edit') { act.editMode = false; renderAll_(); }
        if (action === 'update-request') await updateRequest_();
        if (action === 'change-approver') await changeApprover_(button);
        if (action === 'approve') await approveRequest_(button.dataset.taskId);
        if (action === 'reject') await rejectRequest_(button.dataset.taskId);
        if (action === 'refresh') await refresh_(true);
      } catch (error) {
        feedback_(error && error.message || 'Proses Activity gagal.', 'error');
      }
    });

    workspace.addEventListener('change', async event => {
      const select = event.target.closest('.gtt-act-route-select');
      if (!select) return;
      await handleRouteChange_(select);
    });

    const modal = document.getElementById('gttActModal');
    const ok = document.getElementById('gttActModalOk');
    const cancel = document.getElementById('gttActModalCancel');
    if (ok) ok.addEventListener('click', () => closeConfirm_(true));
    if (cancel) cancel.addEventListener('click', () => closeConfirm_(false));
    if (modal) {
      modal.addEventListener('click', event => {
        if (event.target === modal) closeConfirm_(false);
      });
    }
  }

  function confirm_(title, message, okText) {
    return new Promise(resolve => {
      const modal = document.getElementById('gttActModal');
      const titleEl = document.getElementById('gttActModalTitle');
      const messageEl = document.getElementById('gttActModalMessage');
      const ok = document.getElementById('gttActModalOk');
      if (!modal || !titleEl || !messageEl || !ok) {
        resolve(window.confirm(message));
        return;
      }
      act.modalResolve = resolve;
      titleEl.textContent = title || 'Konfirmasi';
      messageEl.textContent = message || '';
      ok.textContent = okText || 'YA';
      modal.hidden = false;
      modal.setAttribute('aria-hidden', 'false');
      window.setTimeout(() => ok.focus(), 0);
    });
  }

  function closeConfirm_(value) {
    const modal = document.getElementById('gttActModal');
    if (modal) {
      modal.hidden = true;
      modal.setAttribute('aria-hidden', 'true');
    }
    const resolver = act.modalResolve;
    act.modalResolve = null;
    if (resolver) resolver(Boolean(value));
  }

  function renderBootstrapState_(mode, message) {
    ensureWorkspace_();
    ensureVersionModule_();
    const host = document.getElementById('gttActMainSection');
    const approval = document.getElementById('gttActApprovalQueue');
    const info = document.getElementById('gttActInfoGrid');
    if (!host) return;

    if (approval) { approval.hidden = true; approval.innerHTML = ''; }
    if (info) info.innerHTML = '';

    const isError = mode === 'error';
    host.innerHTML = `
      <div class="gtt-act-section-title">
        <div>
          <span>Sales Advisor Activity</span>
          <strong>${isError ? 'Data belum dapat dimuat' : 'Memuat data Activity...'}</strong>
        </div>
        <span class="gtt-act-badge ${isError ? 'gtt-act-badge-pending' : 'gtt-act-badge-active'}">${isError ? 'RETRY' : 'LOADING'}</span>
      </div>
      <div class="gtt-act-status-strip">
        <div class="gtt-act-status-cell">
          <span>Status Activity</span>
          <strong>${isError ? 'Gagal memuat' : 'Menghubungkan server'}</strong>
        </div>
        <div class="gtt-act-status-cell">
          <span>GTT Version</span>
          <strong>${esc_(ACT_VERSION)}</strong>
        </div>
      </div>
      <p class="gtt-act-note">${esc_(message || (isError ? 'Tekan COBA LAGI untuk memuat ulang.' : 'Mohon tunggu...'))}</p>
      ${isError ? '<div class="gtt-act-button-row gtt-act-single"><button class="gtt-act-btn gtt-act-btn-primary" type="button" data-gtt-act="refresh">COBA LAGI</button></div>' : ''}
    `;
  }

  function stopPolling_() {
    if (act.pollingId) {
      window.clearInterval(act.pollingId);
      act.pollingId = null;
    }
  }

  async function refresh_(manual) {
    const pin = currentPin_();
    if (!pin || act.busy || act.bootstrapInFlight) return false;

    act.bootstrapInFlight = true;
    act.lastAttemptPin = pin;
    act.lastAttemptAtMs = Date.now();
    if (!act.data) renderBootstrapState_('loading', 'Membaca data pengguna, Tugas Luar, approval, dan aktivitas outlet.');
    if (manual) setBusy_(true);

    try {
      const response = await api_('apiGttActBootstrap', [pin]);
      if (!response || response.success !== true || !response.data) {
        throw new Error(response && response.message || 'Data Sales Advisor Activity gagal dimuat.');
      }

      act.bootstrapError = '';
      act.bootstrapFailureCount = 0;
      applyData_(response.data);
      return true;
    } catch (error) {
      const message = error && error.message ? error.message : 'Data Sales Advisor Activity gagal dimuat.';
      act.bootstrapError = message;
      act.bootstrapFailureCount += 1;
      act.lastPin = pin; // hentikan loop bootstrap 1,5 detik; retry dilakukan manual/ketika sesi berubah.
      act.data = null;
      stopPolling_();
      renderBootstrapState_('error', message);
      console.error('[GTT ACTIVITY BETA.2] bootstrap gagal:', error);
      if (manual) feedback_(message, 'error');
      return false;
    } finally {
      act.bootstrapInFlight = false;
      if (manual) setBusy_(false);
    }
  }

  function applyData_(data) {
    act.data = data || {};
    act.fetchedAtMs = Date.now();
    act.serverOffsetMs = Number(data && data.serverNowMs || Date.now()) - Date.now();

    act.lastAttemptPin = act.lastPin;
    act.bootstrapError = '';
    renderAll_();
    syncHomeMonitoring_();
    configurePolling_();
  }

  function renderAll_() {
    if (!act.data) return;
    ensureWorkspace_();
    ensureVersionModule_();
    renderMain_();
    renderApprovalQueue_();
    renderInfoGrid_();
    renderOutletSummary_();
    syncHeroIdentity_();
    syncHomeMonitoring_();

  function syncHeroIdentity_() {
    const data = act.data || {};

  function renderMain_() {
    const host = document.getElementById('gttActMainSection');
    if (!host || !act.data) return;
    const current = act.data.currentTask;

    if (act.editMode && current && current.status !== 'IN_PROGRESS') {
      host.innerHTML = buildFormHtml_(current, true);
      hydrateRouteRows_(current.route || []);
      selectApprover_(current.approverId || '');
      const purpose = document.getElementById('gttActPurpose');
      if (purpose) purpose.value = current.purpose || '';
      return;
    }

    if (!current) {
      host.innerHTML = buildFormHtml_(null, false);
      hydrateRouteRows_([]);
      return;
    }

    if (current.status === 'PENDING_APPROVAL') {
      host.innerHTML = buildPendingHtml_(current);
      populatePendingApprover_(current);
      return;
    }

    if (current.status === 'APPROVED') {
      host.innerHTML = buildApprovedHtml_(current);
      return;
    }

    if (current.status === 'IN_PROGRESS') {
      host.innerHTML = buildActiveHtml_(current);

    host.innerHTML = buildFormHtml_(null, false);

          ${request.canAct ? `
            <div class="gtt-act-button-row">
              <button class="gtt-act-btn gtt-act-btn-danger" type="button" data-gtt-act="reject" data-task-id="${esc_(request.taskId)}">TOLAK</button>
              <button class="gtt-act-btn gtt-act-btn-primary" type="button" data-gtt-act="approve" data-task-id="${esc_(request.taskId)}">SETUJUI</button>
            </div>
          ` : `
            <div class="gtt-act-note">Bisa dilihat, tetapi approval hanya aktif pada akun approver yang dipilih.</div>
          `}
        </article>
      `).join('')}
    `;
  }

  function renderInfoGrid_() {
    const host = document.getElementById('gttActInfoGrid');
    if (!host || !act.data) return;
    const current = act.data.currentTask;
    const myToday = Array.isArray(act.data.myToday) ? act.data.myToday : [];
    const team = act.data.team || {};

    host.innerHTML = `
      <section class="gtt-act-info-card gtt-act-accent-red">
        <div class="gtt-act-info-title">Status TL Saya</div>
        ${myStatusHtml_(current)}
      </section>

      <section class="gtt-act-info-card">
        <div class="gtt-act-info-title">TL Saya Hari Ini</div>
        ${myHistoryHtml_(myToday)}
      </section>

      <section class="gtt-act-info-card gtt-act-accent-green">
        <div class="gtt-act-info-title">Tugas Luar Tim</div>
        ${teamOutsideHtml_(team.outside || [])}
      </section>

      <section class="gtt-act-info-card gtt-act-accent-amber">
        <div class="gtt-act-info-title">Break Tim Outlet</div>
        ${teamBreakHtml_(team.break1 || [], team.break2 || [])}
      </section>
    `;
    updateLiveTimers_();
  }

  function renderOutletSummary_() {
    const host = document.getElementById('gttActOutletSummary');
    if (!host || !act.data) return;

    const user = act.data.user || {};
    const team = act.data.team || {};
    const rows = Array.isArray(team.tlToday) ? team.tlToday : [];
    const outlet = user.outlet || '—';
    const dateLabel = act.data.dateLabel || act.data.dateKey || '';

    host.innerHTML = `
      <div class="gtt-act-summary-head">
        <span>Ringkasan TL — ${esc_(outlet)}</span>
        <strong>${esc_(dateLabel)}</strong>
      </div>
      ${rows.length ? `
        <div class="gtt-act-summary-table-wrap">
          <table class="gtt-act-summary-table" aria-label="Ringkasan Tugas Luar ${esc_(outlet)} ${esc_(dateLabel)}">
            <thead>
              <tr>
                <th scope="col">SA</th>
                <th scope="col">TL</th>
                <th scope="col">Tujuan</th>
                <th scope="col">Durasi</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(item => {
                const active = item.status === 'IN_PROGRESS';
                const duration = active
                  ? `<span class="gtt-act-summary-duration-active" data-gtt-act-live="summary" data-base-seconds="${Number(item.elapsedSeconds || 0)}">${esc_(formatMinutes_(item.elapsedSeconds || 0))}</span>`
                  : `${Math.max(0, Number(item.durationMinutes || 0))} menit`;
                return `
                  <tr>
                    <td class="gtt-act-summary-name">${esc_(item.nama || 'SA')}</td>
                    <td>${esc_(item.taskNo || '—')}</td>
                    <td class="gtt-act-summary-route">${esc_(item.routeLabel || '—')}</td>
                    <td>${duration}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      ` : `
        <div class="gtt-act-summary-empty">Belum ada Tugas Luar yang dimulai hari ini di outlet ${esc_(outlet)}.</div>
      `}
    `;

    updateLiveTimers_();
  }

  function myStatusHtml_(task) {
    if (!task) return '<div class="gtt-act-empty">Tidak ada Tugas Luar aktif/pending. Siap membuat tugas baru.</div>';

    let label = task.status;
    let detail = task.routeLabel || '—';
    if (task.status === 'PENDING_APPROVAL') label = 'Menunggu Persetujuan';
    if (task.status === 'APPROVED') label = `TL ${task.taskNo || ''} Disetujui`;
    if (task.status === 'IN_PROGRESS') label = `TL ${task.taskNo || ''} Berlangsung`;

    return `
      <div class="gtt-act-list">
        <div class="gtt-act-list-item">
          <strong>${esc_(label)}</strong>
          <span>${esc_(detail)}</span>
          <small>${task.approverName ? 'Approver: ' + esc_(task.approverName) : ''}</small>
        </div>
      </div>
    `;
  }

  function myHistoryHtml_(tasks) {
    const items = (tasks || []).filter(task => Number(task.taskNo || 0) > 0);
    if (!items.length) return '<div class="gtt-act-empty">Belum ada Tugas Luar yang mendapat nomor hari ini.</div>';

    return `<div class="gtt-act-list">${items.map(task => {
      const minutes = task.status === 'IN_PROGRESS'
        ? liveMinutes_(task.elapsedSeconds || 0)
        : Number(task.durationMinutes || 0);
      const statusText = task.status === 'IN_PROGRESS'
        ? 'Sedang berlangsung'
        : task.status === 'COMPLETED'
          ? `${minutes} menit`
          : task.status === 'CANCELLED'
            ? 'Dibatalkan'
            : task.status === 'APPROVED'
              ? 'Belum dimulai'
              : task.status;

      return `
        <div class="gtt-act-list-item">
          <strong>Tugas Luar ${esc_(task.taskNo)}</strong>
          <span>${esc_(task.routeLabel || '—')}</span>
          <small>${esc_(task.startTime || '--:--:--')} ${task.endTime ? '– ' + esc_(task.endTime) : ''} · ${esc_(statusText)}</small>
        </div>
      `;
    }).join('')}</div>`;
  }

  function teamOutsideHtml_(items) {
    if (!items.length) return '<div class="gtt-act-empty">Tidak ada SA outlet ini yang sedang Tugas Luar.</div>';
    return `<div class="gtt-act-list">${items.map(item => `
      <div class="gtt-act-list-item">
        <strong>${esc_(item.nama || 'SA')}</strong>
        <span>${esc_(item.routeLabel || '—')}</span>
        <small data-gtt-act-live="outside" data-base-seconds="${Number(item.elapsedSeconds || 0)}">${esc_(formatMinutes_(item.elapsedSeconds || 0))}</small>
      </div>
    `).join('')}</div>`;
  }

  function teamBreakHtml_(b1, b2) {
    const rows = [];
    (b1 || []).forEach(item => rows.push({ ...item, label: 'BREAK 1' }));
    (b2 || []).forEach(item => rows.push({ ...item, label: 'BREAK 2' }));
    if (!rows.length) return '<div class="gtt-act-empty">Tidak ada SA outlet ini yang sedang Break 1/2.</div>';

    return `<div class="gtt-act-list">${rows.map(item => `
      <div class="gtt-act-list-item">
        <strong>${esc_(item.nama || 'SA')}</strong>
        <span>${esc_(item.label)}</span>
        <small data-gtt-act-live="break" data-base-seconds="${Number(item.elapsedSeconds || 0)}">${esc_(formatMinutes_(item.elapsedSeconds || 0))}</small>
      </div>
    `).join('')}</div>`;
  }

  function routeHtml_(route) {
    const list = Array.isArray(route) ? route : [];
    if (!list.length) return '<span>—</span>';
    return list.map((item, index) => {
      const name = item && item.type === 'OTHER'
        ? item.name
        : (item && (item.code || item.display || item.name));
      return `<span>${index + 1}. ${esc_(name || '—')}</span>`;
    }).join('');
  }

  function hydrateRouteRows_(route) {
    const host = document.getElementById('gttActRouteRows');
    if (!host) return;
    host.innerHTML = '';
    const list = Array.isArray(route) && route.length ? route : [null];
    list.forEach(item => addRouteRow_(item));
    populateFormApprovers_();
  }

  function addRouteRow_(item) {
    const host = document.getElementById('gttActRouteRows');
    if (!host) return;
    const currentCount = host.querySelectorAll('.gtt-act-route-row').length;
    if (currentCount >= MAX_ROUTE_STOPS) {
      feedback_('Maksimal ' + MAX_ROUTE_STOPS + ' tujuan dalam satu Tugas Luar.', 'warning');
      return;
    }

    const row = document.createElement('div');
    row.className = 'gtt-act-route-row';
    row.innerHTML = `
      <div class="gtt-act-route-number">${currentCount + 1}</div>
      <div class="gtt-act-route-control">
        <select class="gtt-act-route-select"></select>
        <input class="gtt-act-route-other" type="text" maxlength="120" placeholder="Tulis lokasi tujuan" hidden>
      </div>
      <button class="gtt-act-remove-route" type="button" data-gtt-act="remove-route" aria-label="Hapus tujuan">×</button>
    `;
    host.appendChild(row);

    const select = row.querySelector('.gtt-act-route-select');
    populateDestinationSelect_(select);

    if (item) {
      if (item.type === 'OTHER') {
        select.value = '__LAINNYA__';
        const other = row.querySelector('.gtt-act-route-other');
        other.hidden = false;
        other.value = item.name || '';
      } else {
        select.value = item.code || '';
      }
    }

    renumberRouteRows_();
  }

  function removeRouteRow_(button) {
    const host = document.getElementById('gttActRouteRows');
    const row = button && button.closest('.gtt-act-route-row');
    if (!host || !row) return;
    const rows = host.querySelectorAll('.gtt-act-route-row');
    if (rows.length <= 1) {
      const select = row.querySelector('.gtt-act-route-select');
      const other = row.querySelector('.gtt-act-route-other');
      if (select) select.value = '';
      if (other) { other.value = ''; other.hidden = true; }
      return;
    }
    row.remove();
    renumberRouteRows_();
  }

  function renumberRouteRows_() {
    document.querySelectorAll('#gttActRouteRows .gtt-act-route-row').forEach((row, index) => {
      const number = row.querySelector('.gtt-act-route-number');
      if (number) number.textContent = String(index + 1);
    });
  }

  function populateDestinationSelect_(select) {
    if (!select) return;
    const selected = select.value;
    const options = act.data && Array.isArray(act.data.destinations) ? act.data.destinations : [];
    select.innerHTML = '<option value="">Pilih tujuan</option>';
    options.forEach(item => {
      const option = document.createElement('option');
      option.value = item.code || '';
      option.textContent = `${item.code || ''} - ${item.name || ''}`;
      select.appendChild(option);
    });
    const other = document.createElement('option');
    other.value = '__LAINNYA__';
    other.textContent = 'Lainnya';
    select.appendChild(other);
    if ([...select.options].some(option => option.value === selected)) select.value = selected;
  }

  async function handleRouteChange_(select) {
    const row = select.closest('.gtt-act-route-row');
    if (!row) return;
    const other = row.querySelector('.gtt-act-route-other');
    if (other) {
      other.hidden = select.value !== '__LAINNYA__';
      if (select.value !== '__LAINNYA__') other.value = '';
    }

    if (!select.value || select.value === '__LAINNYA__') return;

    const same = [...document.querySelectorAll('#gttActRouteRows .gtt-act-route-select')]
      .filter(otherSelect => otherSelect !== select && otherSelect.value === select.value);

    if (!same.length) return;
    const accepted = await confirm_(
      'Tujuan Sudah Dipilih',
      `${select.value} sudah ada dalam daftar tujuan. Tambahkan ${select.value} sekali lagi?`,
      'YA, TAMBAHKAN'
    );
    if (!accepted) select.value = '';
  }

  function populateFormApprovers_() {
    const select = document.getElementById('gttActApproverSelect');
    if (!select) return;
    const selected = select.value;
    const approvers = act.data && Array.isArray(act.data.approvers) ? act.data.approvers : [];
    select.innerHTML = '<option value="">Pilih SL / SPV / Manager</option>';
    approvers.forEach(item => {
      const option = document.createElement('option');
      option.value = item.saId || '';
      option.textContent = `${item.nama || '-'} — ${item.jabatan || '-'}`;
      select.appendChild(option);
    });
    if ([...select.options].some(option => option.value === selected)) select.value = selected;
  }

  function selectApprover_(approverId) {
    populateFormApprovers_();
    const select = document.getElementById('gttActApproverSelect');
    if (select && [...select.options].some(option => option.value === approverId)) select.value = approverId;
  }

  function populatePendingApprover_(task) {
    const select = document.getElementById('gttActPendingApprover');
    if (!select) return;
    const approvers = act.data && Array.isArray(act.data.approvers) ? act.data.approvers : [];
    select.innerHTML = '<option value="">Pilih SL / SPV / Manager</option>';
    approvers.forEach(item => {
      const option = document.createElement('option');
      option.value = item.saId || '';
      option.textContent = `${item.nama || '-'} — ${item.jabatan || '-'}`;
      select.appendChild(option);
    });
    if ([...select.options].some(option => option.value === task.approverId)) select.value = task.approverId;
  }

  function collectForm_() {
    const route = [];
    const rows = [...document.querySelectorAll('#gttActRouteRows .gtt-act-route-row')];
    rows.forEach((row, index) => {
      const select = row.querySelector('.gtt-act-route-select');
      const other = row.querySelector('.gtt-act-route-other');
      const value = select ? select.value : '';
      if (!value) return;
      if (value === '__LAINNYA__') {
        route.push({ order: index + 1, type: 'OTHER', code: 'LAINNYA', name: String(other && other.value || '').trim() });
      } else {
        const option = select && select.options[select.selectedIndex];
        route.push({ order: index + 1, type: 'OUTLET', code: value, name: option ? option.textContent : value });
      }
    });

    const purpose = document.getElementById('gttActPurpose');
    const approver = document.getElementById('gttActApproverSelect');
    return {
      route,
      purpose: String(purpose && purpose.value || '').trim(),
      approverId: String(approver && approver.value || '').trim()
    };
  }

  function validateForm_(form) {
    if (!form.route.length) throw new Error('Pilih minimal 1 tujuan Tugas Luar.');
    form.route.forEach((item, index) => {
      if (item.type === 'OTHER' && !String(item.name || '').trim()) {
        throw new Error('Tujuan Lainnya pada urutan ' + (index + 1) + ' wajib diisi.');
      }
    });
    if (!form.purpose) throw new Error('Keperluan Tugas Luar wajib diisi.');
    if (!form.approverId) throw new Error('Pilih SL/SPV/Manager untuk persetujuan.');
  }

  async function submitRequest_() {
    const form = collectForm_();
    validateForm_(form);
    const accepted = await confirm_(
      'Kirim Persetujuan',
      `Rute: ${form.route.map((item, i) => `${i + 1}. ${item.type === 'OTHER' ? item.name : item.code}`).join('  ')}\n\nKirim permintaan approval Tugas Luar?`,
      'KIRIM'
    );
    if (!accepted) return;

    setBusy_(true);
    try {
      const response = await api_('apiGttActSubmitApproval', [currentPin_(), form]);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Permintaan gagal dikirim.');
      act.editMode = false;
      applyData_(response.data);
      feedback_(response.message || 'Permintaan approval berhasil dikirim.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  async function updateRequest_() {
    const current = act.data && act.data.currentTask;
    if (!current) return;
    const form = collectForm_();
    validateForm_(form);
    const accepted = await confirm_(
      'Simpan Perubahan',
      'Perubahan rute/keperluan akan membuat status kembali PENDING dan memerlukan approval ulang.',
      'SIMPAN'
    );
    if (!accepted) return;

    setBusy_(true);
    try {
      const response = await api_('apiGttActUpdateRequest', [currentPin_(), current.taskId, form]);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Perubahan gagal disimpan.');
      act.editMode = false;
      applyData_(response.data);
      feedback_(response.message || 'Data diperbarui.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  async function changeApprover_() {
    const current = act.data && act.data.currentTask;
    const select = document.getElementById('gttActPendingApprover');
    const approverId = String(select && select.value || '').trim();
    if (!current || !approverId) throw new Error('Pilih approver pengganti.');
    if (approverId === current.approverId) throw new Error('Pilih approver yang berbeda dari approver sekarang.');

    const accepted = await confirm_('Ganti Approver', 'Request ke approver lama akan dialihkan ke approver baru.', 'GANTI');
    if (!accepted) return;

    setBusy_(true);
    try {
      const response = await api_('apiGttActChangeApprover', [currentPin_(), current.taskId, approverId]);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Approver gagal diganti.');
      applyData_(response.data);
      feedback_(response.message || 'Approver berhasil diganti.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  function beginEditCurrentTask_() {
    const current = act.data && act.data.currentTask;
    if (!current || current.status === 'IN_PROGRESS') return;
    act.editMode = true;
    renderMain_();
  }

  async function approveRequest_(taskId) {
    const accepted = await confirm_('Setujui Tugas Luar', 'Anda menyetujui permintaan Tugas Luar ini dari akun GTT Anda sendiri.', 'SETUJUI');
    if (!accepted) return;
    setBusy_(true);
    try {
      const response = await api_('apiGttActApprove', [currentPin_(), taskId]);

      feedback_(response.message || 'Tugas Luar disetujui.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  async function rejectRequest_(taskId) {
    const accepted = await confirm_('Tolak Tugas Luar', 'Tolak permintaan Tugas Luar ini?', 'TOLAK');
    if (!accepted) return;
    setBusy_(true);
    try {
      const response = await api_('apiGttActReject', [currentPin_(), taskId]);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Penolakan gagal diproses.');

      feedback_(response.message || 'Permintaan ditolak.', 'success');
    } finally {
      setBusy_(false);
    }

  async function startTask_() {
    const current = act.data && act.data.currentTask;
    if (!current) return;

    const myBreakActive = [...(act.data.team && act.data.team.break1 || []), ...(act.data.team && act.data.team.break2 || [])]
      .some(item => String(item.pin || '') === currentPin_());
    if (myBreakActive) throw new Error('Selesaikan Break terlebih dahulu sebelum memulai Tugas Luar.');

    const accepted = await confirm_(
      'Mulai Tugas Luar',
      `Tugas Luar ${current.taskNo || ''}\nRute: ${current.routeLabel || '—'}\n\nGPS outlet asal akan divalidasi.`,
      'MULAI'
    );
    if (!accepted) return;

    setBusy_(true);
    try {
      feedback_('Memeriksa geofence outlet asal...', 'info');
      const location = typeof getFreshLocationForAction_ === 'function'
        ? await getFreshLocationForAction_()
        : await getLocationFallback_();
      const response = await api_('apiGttActStart', [currentPin_(), current.taskId, location]);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Tugas Luar gagal dimulai.');
      applyData_(response.data);
      feedback_(response.message || 'Tugas Luar dimulai.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  async function finishTask_() {
    const current = act.data && act.data.currentTask;
    if (!current || current.status !== 'IN_PROGRESS') return;
    const accepted = await confirm_(
      'Selesaikan Tugas Luar',
      `Pastikan Anda sudah kembali ke outlet ${act.data.user && act.data.user.outlet || ''}. GPS akan divalidasi sebelum tugas ditutup.`,
      'YA, SELESAIKAN'
    );
    if (!accepted) return;

    setBusy_(true);
    try {
      feedback_('Memeriksa geofence kembali...', 'info');
      const location = typeof getFreshLocationForAction_ === 'function'
        ? await getFreshLocationForAction_()
        : await getLocationFallback_();
      const response = await api_('apiGttActFinish', [currentPin_(), current.taskId, location]);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Tugas Luar gagal diselesaikan.');
      act.editMode = false;
      applyData_(response.data);
      feedback_(response.message || 'Tugas Luar selesai.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  async function cancelTask_() {
    const current = act.data && act.data.currentTask;
    if (!current) return;
    if (current.status === 'IN_PROGRESS') throw new Error('Tugas Luar yang sudah berjalan tidak dapat dibatalkan sendiri.');
    const accepted = await confirm_(
      current.status === 'PENDING_APPROVAL' ? 'Batalkan Permintaan' : 'Batalkan Tugas Luar',
      'Data pembatalan tetap disimpan untuk audit.',
      'YA, BATALKAN'
    );
    if (!accepted) return;

    setBusy_(true);
    try {
      const response = await api_('apiGttActCancel', [currentPin_(), current.taskId, 'Dibatalkan oleh SA sebelum Tugas Luar dimulai.']);
      if (!response || response.success !== true) throw new Error(response && response.message || 'Pembatalan gagal.');
      act.editMode = false;
      applyData_(response.data);
      feedback_(response.message || 'Tugas Luar dibatalkan.', 'success');
    } finally {
      setBusy_(false);
    }
  }

  function getLocationFallback_() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Perangkat tidak mendukung GPS.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({
          latitude: Number(pos.coords.latitude),
          longitude: Number(pos.coords.longitude),
          accuracy: Number(pos.coords.accuracy),
          timestamp: pos.timestamp || Date.now()
        }),
        () => reject(new Error('Lokasi tidak dapat diperoleh.')),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  function shortDateTime_(text) {
    const value = String(text || '').trim();
    if (!value) return '';
    const match = value.match(/(\d{2}:\d{2}:\d{2})/);
    return match ? match[1] : value;
  }

  function secondsNowFromBase_(base) {
    const delta = Math.max(0, Math.floor((Date.now() - act.fetchedAtMs) / 1000));
    return Math.max(0, Number(base || 0) + delta);
  }

  function formatHms_(seconds) {
    const safe = Math.max(0, Math.floor(Number(seconds || 0)));
    const h = Math.floor(safe / 3600);
    const m = Math.floor((safe % 3600) / 60);
    const s = safe % 60;
    return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
  }

  function formatMinutes_(seconds) {
    const minutes = Math.max(0, Math.floor(Number(seconds || 0) / 60));
    return minutes + ' menit';
  }

  function liveMinutes_(baseSeconds) {
    return Math.max(0, Math.floor(secondsNowFromBase_(baseSeconds) / 60));
  }

  function updateLiveTimers_() {
    if (!act.data) return;
    const current = act.data.currentTask;
    if (current && current.status === 'IN_PROGRESS') {
      const seconds = secondsNowFromBase_(current.elapsedSeconds || 0);
      const currentDuration = document.getElementById('gttActCurrentDuration');
      if (currentDuration) currentDuration.textContent = formatHms_(seconds);
    }

    document.querySelectorAll('[data-gtt-act-live]').forEach(el => {
      const seconds = secondsNowFromBase_(Number(el.dataset.baseSeconds || 0));
      el.textContent = formatMinutes_(seconds);
    });

    syncHomeMonitoring_();
  }

  function homeRouteItems_() {
    const current = act.data && act.data.currentTask;
    if (!current || current.status !== 'IN_PROGRESS') return [];
    return Array.isArray(current.route) ? current.route : [];
  }

  function syncHomeMonitoring_() {
    if (!act.data) return;
    const current = act.data.currentTask;
    const active = current && current.status === 'IN_PROGRESS';

    const badge = document.getElementById('homeOutsideDutyActiveBadge');
    if (badge && badge.hidden !== !active) badge.hidden = !active;

    if (active) {
      const since = document.getElementById('homeOutsideDutySince');
      const duration = document.getElementById('homeOutsideDutyDuration');
      if (since) since.textContent = String(current.startTime || '--:--').slice(0, 5);
      if (duration) duration.textContent = formatHms_(secondsNowFromBase_(current.elapsedSeconds || 0));
    }

    const teamCount = act.data.team && Array.isArray(act.data.team.outside) ? act.data.team.outside.length : 0;
    const homeCount = document.getElementById('homeOutsideSummary');
    if (homeCount) {
      const desiredCount = teamCount ? `${teamCount} SA sedang keluar` : 'Tidak ada SA keluar';
      if (homeCount.textContent !== desiredCount) homeCount.textContent = desiredCount;
    }

    const value = document.getElementById('homeOutsideDurationSummary');
    if (value) {
      const card = value.closest('.home-summary-item');
      const label = card && card.querySelector('span');
      if (label) label.textContent = 'Rute Tugas Luar Aktif';

      const routes = homeRouteItems_();
      const maxVisible = 3;
      const shown = routes.slice(0, maxVisible);
      const html = shown.length
        ? `<span id="gttActHomeRouteValue">${shown.map((item, index) => {
            const name = item.type === 'OTHER' ? item.name : (item.code || item.display || item.name);
            return `<span>${index + 1}. ${esc_(name || '—')}</span>`;
          }).join('')}${routes.length > maxVisible ? `<span>+${routes.length - maxVisible} tujuan</span>` : ''}</span>`
        : '<span id="gttActHomeRouteValue"><span>Tidak ada</span></span>';
      if (value.innerHTML !== html) value.innerHTML = html;
    }
  }

  function bindHomeObservers_() {
    if (act.homeObserversBound) return;
    act.homeObserversBound = true;

    const routeValue = document.getElementById('homeOutsideDurationSummary');
    const countValue = document.getElementById('homeOutsideSummary');
    const badge = document.getElementById('homeOutsideDutyActiveBadge');

    const observer = new MutationObserver(() => {
      if (act.data) window.setTimeout(syncHomeMonitoring_, 0);
    });
    if (routeValue) observer.observe(routeValue, { childList: true, subtree: true, characterData: true });
    if (countValue) observer.observe(countValue, { childList: true, subtree: true, characterData: true });
    if (badge) observer.observe(badge, { attributes: true, attributeFilter: ['hidden'] });
  }

  function bindOperationalConflictGuard_() {
    document.addEventListener('click', event => {
      const current = act.data && act.data.currentTask;
      if (!current || current.status !== 'IN_PROGRESS') return;

      const target = event.target && event.target.closest
        ? event.target.closest('#saPulangButton, #saMainActionButton, [id^="breakSession"][id$="Button"]')
        : null;
      if (!target) return;

      const id = target.id || '';
      const actionCode = String(target.dataset && target.dataset.actionCode || '').toUpperCase();
      const isPulang = id === 'saPulangButton' || actionCode === 'ABSEN_PULANG';
      const isBreak = id.indexOf('breakSession') === 0 || actionCode.indexOf('BREAK') !== -1;

      if (!isPulang && !isBreak) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      feedback_(
        isPulang
          ? 'Selesaikan Tugas Luar terlebih dahulu sebelum Absen Pulang.'
          : 'Break tidak dapat dimulai saat Tugas Luar masih berlangsung.',
        'warning'
      );
    }, true);
  }

  function configurePolling_() {
    stopPolling_();
    if (!act.data) return;

    const current = act.data && act.data.currentTask;
    const interval = current && current.status === 'PENDING_APPROVAL'
      ? REFRESH_PENDING_MS
      : REFRESH_VISIBLE_MS;

    act.pollingId = window.setInterval(() => {
      if (document.hidden || act.busy || act.bootstrapInFlight || !currentPin_() || !act.data) return;
      const view = document.getElementById('saOutsideDutyView');
      const pending = act.data && act.data.currentTask && act.data.currentTask.status === 'PENDING_APPROVAL';
      if (pending || (view && !view.hidden)) refresh_(false);
    }, interval);
  }

  function startTick_() {
    if (act.tickId) return;
    act.tickId = window.setInterval(updateLiveTimers_, 1000);
  }

  function startSessionWatcher_() {
    if (act.sessionWatchId) return;
    act.sessionWatchId = window.setInterval(() => {
      const pin = currentPin_();
      const user = currentUser_();

      if (!pin || !user) {
        if (act.lastPin || act.lastAttemptPin) {
          act.lastPin = '';
          act.lastAttemptPin = '';
          act.bootstrapError = '';
          act.bootstrapFailureCount = 0;
          act.data = null;
          act.editMode = false;
          stopPolling_();
        }
        return;
      }

      // Rev-1: hanya bootstrap sekali untuk satu sesi baru.
      // Jika gagal, layar menampilkan COBA LAGI dan tidak membombardir server tiap 1,5 detik.
      if (pin !== act.lastPin && pin !== act.lastAttemptPin && !act.bootstrapInFlight) {
        refresh_(false);
      }
    }, 1500);
  }

  function bindActivityOpenRefresh_() {
    document.addEventListener('click', event => {
      const button = event.target && event.target.closest
        ? event.target.closest('[data-sa-tab="outside"], [data-open-sa-tab="outside"]')
        : null;
      if (!button) return;
      window.setTimeout(() => {
        if (!act.bootstrapInFlight) refresh_(false);
      }, 80);
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && currentPin_() && act.data && !act.bootstrapInFlight) refresh_(false);
    });
  }

  function init_() {
    if (act.initialized) return;
    act.initialized = true;
    ensureWorkspace_();
    ensureVersionModule_();
    bindHomeObservers_();
    bindOperationalConflictGuard_();
    bindActivityOpenRefresh_();
    startTick_();
    startSessionWatcher_();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init_, { once: true });
  } else {
    init_();
  }
})();
</script>
