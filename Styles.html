<style>
  /* GTT-01B — Baseline frontend bersih. Urutan: dasar → UI v2.1 → UI v3. */

:root {
    --primary: #0d47a1;
    --primary-dark: #08306f;
    --primary-light: #1976d2;
    --primary-soft: #e8f0fe;

    --secondary: #e53935;
    --secondary-dark: #b71c1c;
    --secondary-soft: #fdecec;

    --accent: #fbc02d;
    --accent-dark: #c49000;
    --accent-soft: #fff8df;

    --success: #2e7d32;
    --success-dark: #1b5e20;
    --success-soft: #eaf5eb;

    --warning: #f9a825;
    --warning-soft: #fff6da;

    --danger: #e53935;
    --danger-soft: #fdecec;

    --info: #1976d2;
    --info-soft: #eaf3fd;

    --background: #f5f7fa;
    --surface: #ffffff;
    --surface-soft: #f8fafc;

    --text-primary: #1f2937;
    --text-secondary: #6b7280;
    --text-light: #ffffff;

    --border: #d9e2ec;
    --border-strong: #c4d0dc;

    --shadow-small:
      0 4px 12px rgba(13, 71, 161, 0.06);

    --shadow-medium:
      0 12px 30px rgba(13, 71, 161, 0.1);

    --shadow-large:
      0 20px 50px rgba(13, 71, 161, 0.14);

    --radius-large: 20px;
    --radius-medium: 18px;
    --radius-small: 12px;
    --radius-button: 16px;

    --transition:
      0.2s ease;
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--background);
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family:
      Inter,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    background: var(--background);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  img {
    display: block;
    max-width: 100%;
  }

  .app-shell {
    width: 100%;
    min-height: 100vh;
  }

  .page {
    display: none;
    width: 100%;
    min-height: 100vh;
    padding: 24px 18px 40px;
  }

  .page.active {
    display: block;
  }

  /* =====================================================
     LOGIN
  ====================================================== */

  #loginPage {
    display: none;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(
        circle at top right,
        rgba(251, 192, 45, 0.18),
        transparent 30%
      ),
      radial-gradient(
        circle at bottom left,
        rgba(229, 57, 53, 0.1),
        transparent 32%
      ),
      linear-gradient(
        145deg,
        #f8fbff,
        #eaf1fb
      );
  }

  #loginPage.active {
    display: flex;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    padding: 30px 24px 24px;
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.99),
        rgba(255, 255, 255, 0.96)
      );
    border: 1px solid rgba(217, 226, 236, 0.92);
    border-radius: var(--radius-large);
    box-shadow: var(--shadow-large);
    backdrop-filter: blur(12px);
  }

  .brand-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    padding: 7px;
    overflow: hidden;
    border-radius: 24px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow:
      0 12px 26px rgba(13, 71, 161, 0.17);
  }

  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 18px;
  }

  .brand-heading {
    margin-bottom: 28px;
    text-align: center;
  }

  .brand-eyebrow {
    margin: 0 0 7px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .brand-heading h1 {
    margin: 0 0 8px;
    color: var(--primary-dark);
    font-size: 27px;
    line-height: 1.18;
  }

  .brand-heading p:last-child {
    margin: 0;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .login-form label {
    display: block;
    margin-bottom: 9px;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 700;
  }

  .pin-wrapper {
    position: relative;
  }

  .pin-input {
    width: 100%;
    height: 58px;
    padding: 0 78px 0 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-small);
    outline: none;
    background: var(--surface-soft);
    color: var(--text-primary);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 12px;
    transition:
      border-color var(--transition),
      box-shadow var(--transition),
      background var(--transition);
  }

  .pin-input:hover {
    border-color: var(--border-strong);
  }

  .pin-input:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow:
      0 0 0 4px rgba(13, 71, 161, 0.12);
  }

  .pin-input::placeholder {
    color: #aab5c2;
  }

  .toggle-pin-button {
    position: absolute;
    top: 50%;
    right: 10px;
    min-width: 56px;
    padding: 8px 9px;
    transform: translateY(-50%);
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition:
      background var(--transition),
      color var(--transition);
  }

  .toggle-pin-button:hover {
    background: var(--primary-soft);
    color: var(--primary-dark);
  }

  .primary-button,
  .main-action-button {
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: var(--radius-button);
    background:
      linear-gradient(
        135deg,
        var(--primary-light),
        var(--primary-dark)
      );
    color: var(--text-light);
    font-weight: 800;
    cursor: pointer;
    box-shadow:
      0 12px 24px rgba(13, 71, 161, 0.22);
    transition:
      transform 0.15s ease,
      opacity var(--transition),
      box-shadow var(--transition),
      filter var(--transition);
  }

  .primary-button {
    margin-top: 18px;
  }

  .primary-button:hover:not(:disabled),
  .main-action-button:hover:not(:disabled) {
    filter: brightness(1.06);
    box-shadow:
      0 15px 30px rgba(13, 71, 161, 0.28);
  }

  .primary-button:active,
  .main-action-button:active {
    transform: scale(0.985);
  }

  .primary-button:disabled,
  .main-action-button:disabled {
    opacity: 0.48;
    cursor: not-allowed;
    box-shadow: none;
  }

  .system-message {
    min-height: 22px;
    margin-top: 13px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
  }

  .system-message.success {
    color: var(--success);
  }

  .system-message.error {
    color: var(--danger);
  }

  .system-message.warning {
    color: var(--warning);
  }

  .validation-panel {
    display: grid;
    gap: 12px;
    margin-top: 22px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface-soft);
  }

  .validation-item {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .validation-item strong {
    display: block;
    margin-bottom: 2px;
    font-size: 13px;
  }

  .validation-item small {
    color: var(--text-secondary);
    font-size: 12px;
  }

  .status-dot {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #b7c0bb;
    box-shadow:
      0 0 0 4px rgba(183, 192, 187, 0.16);
  }

  .status-dot.online,
  .status-dot.valid {
    background: var(--success);
    box-shadow:
      0 0 0 4px rgba(46, 125, 50, 0.14);
  }

  .status-dot.offline,
  .status-dot.invalid {
    background: var(--danger);
    box-shadow:
      0 0 0 4px rgba(229, 57, 53, 0.14);
  }

  .status-dot.checking {
    background: var(--accent);
    box-shadow:
      0 0 0 4px rgba(251, 192, 45, 0.2);
  }

  .login-footer {
    margin: 18px 0 0;
    color: var(--text-secondary);
    text-align: center;
    font-size: 12px;
  }

  .app-version {
    margin: 7px 0 0;
    color: #98a4b3;
    text-align: center;
    font-size: 11px;
  }

  /* =====================================================
     DASHBOARD — GLOBAL
  ====================================================== */

  #saDashboardPage,
  #adminDashboardPage {
    max-width: 760px;
    margin: 0 auto;
  }

  .dashboard-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
    padding: 13px 15px;
    border: 1px solid rgba(217, 226, 236, 0.94);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow-small);
  }

  .dashboard-brand-identity {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 11px;
  }

  .dashboard-brand-logo {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    padding: 3px;
    object-fit: contain;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #ffffff;
  }

  .dashboard-brand-copy {
    display: grid;
    min-width: 0;
    gap: 2px;
  }

  .dashboard-brand-copy strong {
    overflow: hidden;
    color: var(--primary-dark);
    font-size: 14px;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dashboard-brand-copy span {
    color: var(--text-secondary);
    font-size: 11px;
  }

  .role-badge {
    flex: 0 0 auto;
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .role-badge-sa {
    background: var(--primary-soft);
    color: var(--primary-dark);
  }

  .role-badge-admin {
    background: var(--secondary-soft);
    color: var(--secondary-dark);
  }

  .dashboard-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .welcome-label {
    margin: 0 0 5px;
    color: var(--primary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .dashboard-header h2 {
    margin: 0 0 5px;
    color: var(--text-primary);
    font-size: 25px;
    line-height: 1.2;
  }

  .dashboard-header p:last-child {
    margin: 0;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .logout-button {
    flex: 0 0 auto;
    min-width: 76px;
    padding: 10px 14px;
    border: 1px solid rgba(229, 57, 53, 0.26);
    border-radius: 12px;
    background: var(--surface);
    color: var(--danger);
    font-weight: 800;
    cursor: pointer;
    transition:
      color var(--transition),
      background var(--transition),
      border-color var(--transition),
      transform 0.15s ease;
  }

  .logout-button:hover {
    border-color: var(--danger);
    background: var(--danger-soft);
  }

  .logout-button:active {
    transform: scale(0.97);
  }

  .clock-card,
  .status-card,
  .dashboard-card,
  .summary-card {
    border: 1px solid rgba(217, 226, 236, 0.9);
    background: var(--surface);
    box-shadow: var(--shadow-small);
  }

  .clock-card {
    position: relative;
    margin-bottom: 16px;
    padding: 27px 20px;
    overflow: hidden;
    border: 0;
    border-radius: var(--radius-medium);
    background:
      radial-gradient(
        circle at top right,
        rgba(251, 192, 45, 0.28),
        transparent 34%
      ),
      linear-gradient(
        145deg,
        var(--primary-light),
        var(--primary-dark)
      );
    color: var(--text-light);
    text-align: center;
    box-shadow:
      0 16px 32px rgba(13, 71, 161, 0.25);
  }

  .clock-card::after {
    position: absolute;
    right: -45px;
    bottom: -65px;
    width: 160px;
    height: 160px;
    border: 22px solid rgba(255, 255, 255, 0.07);
    border-radius: 50%;
    content: "";
  }

  .clock-card p {
    position: relative;
    z-index: 1;
    margin: 0 0 7px;
    font-size: 14px;
    opacity: 0.92;
  }

  .clock-card strong {
    position: relative;
    z-index: 1;
    font-size: clamp(37px, 9vw, 54px);
    letter-spacing: 2px;
  }

  .status-card {
    margin-bottom: 16px;
    padding: 19px;
    border-radius: var(--radius-medium);
  }

  .status-card-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .status-card p {
    margin: 0 0 7px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .status-card h3 {
    margin: 0;
    font-size: 20px;
  }

  .attendance-status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
    min-height: 42px;
    padding: 8px;
    border-radius: 50%;
    font-size: 16px;
    font-weight: 900;
  }

  .status-neutral {
    background: #eef2f6;
    color: #7d8997;
  }

  .status-present {
    background: var(--success-soft);
    color: var(--success);
  }

  .status-break {
    background: var(--accent-soft);
    color: var(--accent-dark);
  }

  .status-late {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .status-finished {
    background: var(--info-soft);
    color: var(--info);
  }

  .main-action-button {
    margin-bottom: 16px;
    font-size: 17px;
  }

  .dashboard-card {
    margin-bottom: 16px;
    padding: 20px;
    border-radius: var(--radius-medium);
  }

  .dashboard-card h3 {
    margin: 0 0 14px;
    font-size: 17px;
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .section-heading h3 {
    margin: 0;
  }

  .section-heading span {
    padding: 7px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-size: 12px;
    font-weight: 800;
  }

  #breakStatus {
    margin: 16px 0 8px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  #breakCountdown {
    display: block;
    color: var(--primary-dark);
    font-size: 30px;
    letter-spacing: 1px;
  }

  .empty-state {
    padding: 18px;
    border: 1px dashed var(--border-strong);
    border-radius: 14px;
    background: var(--surface-soft);
    color: var(--text-secondary);
    text-align: center;
    font-size: 13px;
  }

  .dashboard-footer {
    padding: 8px 0 2px;
    color: #98a4b3;
    text-align: center;
    font-size: 11px;
  }

  /* =====================================================
     ADMIN
  ====================================================== */

  .summary-grid {
    display: grid;
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .summary-card {
    position: relative;
    min-height: 112px;
    padding: 17px;
    overflow: hidden;
    border-radius: 17px;
  }

  .summary-card::after {
    position: absolute;
    top: 0;
    right: 0;
    width: 54px;
    height: 5px;
    border-bottom-left-radius: 8px;
    content: "";
  }

  .summary-card span {
    display: block;
    margin-bottom: 12px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .summary-card strong {
    font-size: 30px;
  }

  .summary-present {
    background:
      linear-gradient(
        180deg,
        #ffffff,
        var(--success-soft)
      );
  }

  .summary-present::after {
    background: var(--success);
  }

  .summary-present strong {
    color: var(--success-dark);
  }

  .summary-break {
    background:
      linear-gradient(
        180deg,
        #ffffff,
        var(--accent-soft)
      );
  }

  .summary-break::after {
    background: var(--accent);
  }

  .summary-break strong {
    color: var(--accent-dark);
  }

  .summary-late {
    background:
      linear-gradient(
        180deg,
        #ffffff,
        var(--danger-soft)
      );
  }

  .summary-late::after {
    background: var(--danger);
  }

  .summary-late strong {
    color: var(--danger);
  }

  .summary-absent {
    background:
      linear-gradient(
        180deg,
        #ffffff,
        var(--info-soft)
      );
  }

  .summary-absent::after {
    background: var(--info);
  }

  .summary-absent strong {
    color: var(--primary);
  }

  .admin-menu-grid {
    display: grid;
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .admin-menu-grid button {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 82px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--surface-soft);
    color: var(--text-primary);
    font-weight: 750;
    text-align: left;
    cursor: pointer;
    transition:
      border-color var(--transition),
      background var(--transition),
      transform 0.15s ease;
  }

  .admin-menu-grid button:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  .admin-menu-grid button:active:not(:disabled) {
    transform: scale(0.985);
  }

  .admin-menu-grid button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .admin-menu-icon {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 18px;
    font-weight: 900;
  }

  /* =====================================================
     RESPONSIVE
  ====================================================== */

  @media (min-width: 640px) {
    .page {
      padding: 34px 28px 50px;
    }

    .login-card {
      padding: 36px 34px 29px;
    }

    .brand-logo {
      width: 104px;
      height: 104px;
    }

    .summary-grid {
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
    }

    .dashboard-brand {
      padding: 14px 17px;
    }
  }

  @media (max-width: 480px) {
    .dashboard-brand-copy strong {
      max-width: 180px;
    }

    .dashboard-header {
      align-items: center;
    }

    .dashboard-header h2 {
      max-width: 210px;
      font-size: 22px;
    }

    .logout-button {
      min-width: 68px;
      padding: 9px 12px;
      font-size: 13px;
    }
  }

  @media (max-width: 390px) {
    .page {
      padding-right: 14px;
      padding-left: 14px;
    }

    .login-card {
      padding-right: 19px;
      padding-left: 19px;
    }

    .brand-heading h1 {
      font-size: 24px;
    }

    .dashboard-brand-logo {
      width: 44px;
      height: 44px;
    }

    .dashboard-brand-copy strong {
      max-width: 145px;
      font-size: 13px;
    }

    .dashboard-brand-copy span {
      font-size: 10px;
    }

    .role-badge {
      padding: 6px 9px;
      font-size: 10px;
    }

    .dashboard-header h2 {
      max-width: 185px;
      font-size: 21px;
    }

    .clock-card strong {
      font-size: 37px;
    }

    .admin-menu-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }


  /* =====================================================
     DASHBOARD SA — BOTTOM NAVIGATION PACKAGE 1.2.0
  ====================================================== */
  #saDashboardPage {
    padding-bottom: 112px;
  }

  .dashboard-brand-actions {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .notification-button {
    position: relative;
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--surface);
    color: var(--primary);
    font-size: 19px;
    cursor: pointer;
  }

  .notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border: 2px solid #fff;
    border-radius: 999px;
    background: var(--secondary);
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    line-height: 15px;
    text-align: center;
  }

  .notification-badge[hidden] { display: none; }

  .sa-view-stack { width: 100%; }
  .sa-dashboard-view { display: none; }
  .sa-dashboard-view.active { display: block; animation: saViewIn .18s ease; }

  @keyframes saViewIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-page-header {
    margin: 4px 0 16px;
  }

  .section-page-header h2 {
    margin: 0 0 5px;
    color: var(--primary-dark);
    font-size: 23px;
  }

  .section-page-header p {
