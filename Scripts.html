<script>
  // GTT-01B — Baseline frontend bersih. Urutan: script utama → UI v2.1.

// GTT Frontend Module 7 — API v2 Integration + Break Transaction
  // Kontrak API: bootstrap dan refresh memiliki payload identik; frontend hanya merender data backend.
  const state = {
    user: null,
    pin: '',
    bootstrapData: null,
    location: null,
    online: navigator.onLine,
    isLoginProcessing: false,
    isBootstrapProcessing: false,
    isRefreshProcessing: false,
    isActionProcessing: false,
    refreshTimerId: null,
    lastRefreshAt: 0,
    refreshFailureCount: 0,
    serverClockOffsetMs: 0,
    serverTimeZone: '',
    activeActionCode: '',
    actionButtonOriginalLabel: ''
  };

  const SA_REFRESH_INTERVAL_MS = 10000;

  const PAGE_IDS = [
    'loginPage',
    'saDashboardPage',
    'adminDashboardPage'
  ];

  document.addEventListener('DOMContentLoaded', initializeApp);

  function initializeApp() {
    initializeGttDialog();
    bindEvents();
    updateInternetStatus();
    requestLocation();
    startClock();
    resetLoginForm();
  }

  function bindEvents() {
    const pinInput = document.getElementById('pinInput');
    const loginButton = document.getElementById('loginButton');
    const togglePinButton =
      document.getElementById('togglePinButton');

    if (pinInput) {
      pinInput.addEventListener('input', handlePinInput);
      pinInput.addEventListener('keydown', handlePinKeydown);
    }

    if (loginButton) {
      loginButton.addEventListener('click', runLogin);
    }

    if (togglePinButton) {
      togglePinButton.addEventListener(
        'click',
        togglePinVisibility
      );
    }

    document
      .querySelectorAll('[data-action="logout"]')
      .forEach(button => {
        button.addEventListener('click', logout);
      });


    document
      .querySelectorAll('[data-sa-tab]')
      .forEach(button => {
        button.addEventListener('click', () => {
          openSaTab(button.dataset.saTab);
        });
      });

    document
      .querySelectorAll('[data-open-sa-tab]')
      .forEach(button => {
        button.addEventListener('click', () => {
          openSaTab(button.dataset.openSaTab);
        });
      });

    const mainActionButton =
      document.getElementById('saMainActionButton');

    if (mainActionButton) {
      mainActionButton.addEventListener(
        'click',
        handleSaMainActionClick
      );
    }

    [1, 2].forEach(sessionNumber => {
      const breakButton = document.getElementById(
        `breakSession${sessionNumber}Button`
      );

      if (breakButton) {
        breakButton.addEventListener('click', () => {
          handleBreakSessionActionClick(sessionNumber);
        });
      }
    });

    window.addEventListener('online', handleConnectionOnline);
    window.addEventListener('offline', updateInternetStatus);
    document.addEventListener(
      'visibilitychange',
      handleVisibilityChange
    );
  }

  function handlePinInput(event) {
    const pinInput = event.target;

    pinInput.value = pinInput.value
      .replace(/\D/g, '')
      .slice(0, 4);

    clearLoginMessage();
    updateLoginButton();
  }

  function handlePinKeydown(event) {
    if (event.key !== 'Enter') {
      return;
    }

    event.preventDefault();

    const loginButton =
      document.getElementById('loginButton');

    if (loginButton && !loginButton.disabled) {
      runLogin();
    }
  }

  function updateLoginButton() {
    const pinInput = document.getElementById('pinInput');
    const loginButton =
      document.getElementById('loginButton');

    if (!pinInput || !loginButton) {
      return;
    }

    const pinValid = /^\d{4}$/.test(pinInput.value);

    loginButton.disabled =
      !pinValid ||
      state.isLoginProcessing ||
      !navigator.onLine;
  }

  function runLogin() {
    if (state.isLoginProcessing) {
      return;
    }

    const pinInput = document.getElementById('pinInput');
    const pin = pinInput ? pinInput.value.trim() : '';

    if (!/^\d{4}$/.test(pin)) {
      showLoginMessage(
        'PIN harus terdiri dari 4 angka.',
        'error'
      );
      return;
    }

    if (!navigator.onLine) {
      showLoginMessage(
        'Tidak ada koneksi internet.',
        'error'
      );
      return;
    }

    if (
      typeof google === 'undefined' ||
      !google.script ||
      !google.script.run
    ) {
      showLoginMessage(
        'Aplikasi harus dibuka melalui URL Web App.',
        'error'
      );
      return;
    }

    setLoginProcessing(true);
    showLoginMessage('Memeriksa PIN...', 'warning');

    google.script.run
      .withSuccessHandler(handleLoginSuccess)
      .withFailureHandler(handleLoginFailure)
      .apiLogin(pin);
  }

  function handleLoginSuccess(result) {
    if (!result || result.success !== true) {
      setLoginProcessing(false);

      const message =
        result && result.message
          ? result.message
          : 'Login gagal. Respons server tidak valid.';

      showLoginMessage(message, 'error');
      clearPinInput();
      return;
    }

    if (!result.data) {
      setLoginProcessing(false);

      showLoginMessage(
        'Data pengguna tidak ditemukan.',
        'error'
      );
      clearPinInput();
      return;
    }

    const user = normalizeUserData(result.data);

    if (!user.saId || !user.name || !user.role) {
      setLoginProcessing(false);

      showLoginMessage(
        'Data pengguna belum lengkap.',
        'error'
      );
      clearPinInput();
      return;
    }

    const pinInput = document.getElementById('pinInput');
    const pin = pinInput ? pinInput.value.trim() : '';

    state.user = user;
    state.pin = pin;
    state.bootstrapData = null;

    if (user.role === 'SA') {
      runSaBootstrap(pin);
      return;
    }

    setLoginProcessing(false);
    showLoginMessage('Login berhasil.', 'success');

    setTimeout(() => {
      openDashboard(user);
      clearLoginMessage();
    }, 350);
  }

  function runSaBootstrap(pin) {
    if (state.isBootstrapProcessing) {
      return;
    }

    if (!/^\d{4}$/.test(pin)) {
      setLoginProcessing(false);
      state.user = null;
      state.pin = '';

      showLoginMessage(
        'PIN login tidak valid. Silakan login ulang.',
        'error'
      );
      clearPinInput();
      return;
    }

    // Asumsi kontrak backend: apiBootstrapSA menerima PIN SA 4 digit.
    state.isBootstrapProcessing = true;
    showLoginMessage('Memuat data dashboard...', 'warning');

    google.script.run
      .withSuccessHandler(handleSaBootstrapSuccess)
      .withFailureHandler(handleSaBootstrapFailure)
      .apiBootstrapSA(pin);
  }

  function handleSaBootstrapSuccess(result) {
    state.isBootstrapProcessing = false;
    setLoginProcessing(false);

    if (!result || result.success !== true || !result.data) {
      const message =
        result && result.message
          ? result.message
          : 'Data awal dashboard gagal dimuat.';

      state.user = null;
      state.pin = '';
      state.bootstrapData = null;

      showLoginMessage(message, 'error');
      clearPinInput();
      return;
    }

    state.bootstrapData = result.data;
    state.user = mergeBootstrapUserData(
      state.user,
      result.data.pengguna
    );
    configureServerClock(result.data.waktuServer);

    showLoginMessage('Login berhasil.', 'success');

    setTimeout(() => {
      openDashboard(state.user);
      startSaAutoRefresh();
      clearLoginMessage();
    }, 350);
  }

  function handleSaBootstrapFailure(error) {
    console.error('Bootstrap SA server error:', error);

    state.isBootstrapProcessing = false;
    setLoginProcessing(false);
    state.user = null;
    state.pin = '';
    state.bootstrapData = null;

    const message =
      error && error.message
        ? error.message
        : 'Server tidak dapat memuat dashboard.';

    showLoginMessage(
      'Terjadi kesalahan sistem: ' + message,
      'error'
    );
    clearPinInput();
  }

  function mergeBootstrapUserData(currentUser, bootstrapUser) {
    const base = currentUser || {};
    const source = bootstrapUser || {};

    return {
      saId: base.saId || '',
      name: String(source.namaSA || base.name || '').trim(),
      outlet: String(source.outlet || base.outlet || '').trim(),
      status: String(source.status || base.status || '')
        .trim()
        .toUpperCase(),
      position: base.position || '',
      role: base.role || 'SA'
    };
  }

  function startSaAutoRefresh() {
    stopSaAutoRefresh();

    if (!isSaSessionActive()) {
      return;
    }

    state.refreshTimerId = window.setInterval(
      runSaStatusRefresh,
      SA_REFRESH_INTERVAL_MS
    );

    state.lastRefreshAt = Date.now();
  }

  function stopSaAutoRefresh() {
    if (state.refreshTimerId !== null) {
      window.clearInterval(state.refreshTimerId);
      state.refreshTimerId = null;
    }

    state.isRefreshProcessing = false;
  }

  function runSaStatusRefresh() {
    if (
      !isSaSessionActive() ||
      state.isRefreshProcessing ||
      !navigator.onLine ||
      document.hidden
    ) {
      return;
    }

    if (
      typeof google === 'undefined' ||
      !google.script ||
      !google.script.run
    ) {
      return;
    }

    state.isRefreshProcessing = true;

    google.script.run
      .withSuccessHandler(handleSaRefreshSuccess)
      .withFailureHandler(handleSaRefreshFailure)
      .apiRefreshStatusSA(state.pin);
  }

  function handleSaRefreshSuccess(result) {
    state.isRefreshProcessing = false;
    state.lastRefreshAt = Date.now();

    if (!result || result.success !== true || !result.data) {
      state.refreshFailureCount += 1;
      console.warn(
        'Refresh SA ditolak:',
        result && result.message
          ? result.message
          : 'Respons refresh tidak valid.'
      );
      return;
    }

    state.refreshFailureCount = 0;
    state.bootstrapData = mergeSaRefreshData(
      state.bootstrapData,
      result.data
    );

    if (result.data.pengguna) {
      state.user = mergeBootstrapUserData(
        state.user,
        result.data.pengguna
      );
    }

    if (result.data.waktuServer) {
      configureServerClock(result.data.waktuServer);
    }

    refreshSaDashboardView();
  }

  function handleSaRefreshFailure(error) {
    state.isRefreshProcessing = false;
    state.refreshFailureCount += 1;

    console.error('Refresh status SA gagal:', error);

    // Refresh bersifat nonblokir. Login tetap dipertahankan agar gangguan
    // jaringan sesaat tidak memaksa pengguna login ulang.
  }
  function mergeSaRefreshData(currentData, refreshData) {
    const incoming = refreshData || {};
    return {
      ...(currentData || {}),
      ...incoming,
      pengguna: {
        ...((currentData && currentData.pengguna) || {}),
        ...(incoming.pengguna || {})
      }
    };
  }

  function removeUndefinedProperties(source) {
    return Object.keys(source || {}).reduce((result, key) => {
      if (source[key] !== undefined) {
        result[key] = source[key];
      }

      return result;
    }, {});
  }
  function refreshSaDashboardView() {
    if (!isSaSessionActive()) {
      return;
    }

    renderSaDashboard(state.bootstrapData || {});
  }

  function isSaSessionActive() {
    return Boolean(
      state.user &&
      state.user.role === 'SA' &&
      /^\d{4}$/.test(state.pin)
    );
  }

  function handleConnectionOnline() {
    updateInternetStatus();

    if (isSaSessionActive()) {
      runSaStatusRefresh();
    }
  }

  function handleVisibilityChange() {
    if (!document.hidden && isSaSessionActive()) {
      runSaStatusRefresh();
    }
  }

  function handleLoginFailure(error) {
    console.error('Login server error:', error);

    setLoginProcessing(false);

    const message =
      error && error.message
        ? error.message
        : 'Server tidak dapat memproses login.';

    showLoginMessage(
      'Terjadi kesalahan sistem: ' + message,
      'error'
    );
  }

  function normalizeUserData(data) {
    return {
      saId: String(data.saId || '')
        .trim()
        .toUpperCase(),

      name: String(data.namaSA || '').trim(),

      outlet: String(data.outlet || '').trim(),

      status: String(data.status || '')
        .trim()
        .toUpperCase(),

      position: String(data.jabatan || '').trim(),

      role: String(data.role || '')
        .trim()
        .toUpperCase()
    };
  }

  function openDashboard(user) {
    if (user.role === 'ADMIN') {
      populateAdminDashboard(user);
      showPage('adminDashboardPage');
      return;
    }

    if (user.role === 'SA') {
      populateSaDashboard(user);
      showPage('saDashboardPage');
      return;
    }

    state.user = null;

    showLoginMessage(
      'Role pengguna tidak memiliki akses.',
      'error'
    );

    showPage('loginPage');
  }
  function populateSaDashboard(user) {
    setText('saName', user.name || '-');
    setText(
      'saProfile',
      buildProfileText(user.position, user.outlet)
    );

    setText('profileName', user.name || '-');
    setText('profileSaId', user.saId || '-');
    setText('profilePosition', user.position || '-');
    setText('profileOutlet', user.outlet || '-');
    setText('profileAccountStatus', user.status || 'AKTIF');

    renderSaDashboard(state.bootstrapData || {});
    openSaTab('home');
  }

  function buildProfileText(position, outlet) {
    const parts = [];

    if (position) {
      parts.push(position);
    }

    if (outlet) {
      parts.push(`Outlet ${outlet}`);
    }

    return parts.length ? parts.join(' · ') : '-';
  }

  function renderSaDashboard(data) {
    const payload = data || {};
    const attendance = payload.kehadiran || {};
    const operational = payload.operasional || {};
    const breakData = payload.break || {};
    const summary = payload.ringkasan || {};
    const dashboard = payload.dashboard || {};

    bindAttendanceDashboard(attendance, operational);
    bindOperationalSummary(
      summary,
      dashboard.ringkasanOutlet || {},
      operational
    );
    bindBreakOverview(breakData, operational);
    bindMainActionPreview(operational, breakData);
  }


  function bindAttendanceDashboard(attendance, operational) {
    const attendanceStatus =
      normalizeDisplayValue(
        attendance.statusKehadiran,
        'BELUM ABSEN'
      );

    const operationalStatus =
      normalizeDisplayValue(
        operational.statusOperasional,
        'BELUM ABSEN'
      );

    setText(
      'attendanceStatus',
      formatStatusLabel(attendanceStatus)
    );

    setText(
      'attendanceStatusBadge',
      buildAttendanceBadge(
        attendanceStatus,
        operationalStatus
      )
    );

    setAttendanceBadgeClass(
      attendanceStatus,
      operationalStatus
    );

    setText(
      'checkInTime',
      normalizeClockValue(attendance.jamMasuk)
    );

    setText(
      'checkOutTime',
      normalizeClockValue(attendance.jamPulang)
    );

    setText(
      'attendanceMessage',
      buildAttendanceMessage(
        attendance,
        operationalStatus
      )
    );
  }
  function bindOperationalSummary(summary, outletSummary, operational) {
    const breakOutlet = summary.breakOutlet || {};
    const breakInfo = summary.breakInfo || {};
    const outside = summary.tugasLuar || {};
    const violation = summary.pelanggaran || {};
    const overbreak = summary.overbreak || {};

    setText(
      'homeBreakSummary',
      breakOutlet.teks ||
        `${toSafeNumber(breakOutlet.jumlahSedangBreak)} dari ` +
        `${toSafeNumber(breakOutlet.maksimalBreak)} orang sedang break`
    );

    setText(
      'homeActivitySummary',
      breakInfo.teks ||
        `B1 ${formatStatusLabel(breakInfo.break1 || 'BELUM DIAMBIL')} · ` +
        `B2 ${formatStatusLabel(breakInfo.break2 || 'BELUM DIAMBIL')}`
    );

    setText(
      'homeOutsideSummary',
      outside.tersedia
        ? `Aktif ${toSafeNumber(outside.aktif)} · Pulang ${toSafeNumber(outside.pulang)}`
        : 'Belum tersedia'
    );

    setText(
      'homeViolationSummary',
      violation.tersedia
        ? `${toSafeNumber(violation.jumlah)} tercatat`
        : '0 tercatat'
    );

    setText(
      'homeBreak1Overtime',
      `${toSafeNumber(overbreak.break1Menit)} menit`
    );

    setText(
      'homeBreak2Overtime',
      `${toSafeNumber(overbreak.break2Menit)} menit`
    );

    setText('totalPresent', toSafeNumber(outletSummary.hadirTotal));
    setText('totalBreak', toSafeNumber(outletSummary.sedangBreak));
    setText('totalLate', toSafeNumber(outletSummary.terlambat));
    setText(
      'totalAbsent',
      toSafeNumber(outletSummary.belumAbsen) +
        toSafeNumber(outletSummary.off) +
        toSafeNumber(outletSummary.ijin) +
        toSafeNumber(outletSummary.alpa)
    );

    setText('saShiftName', 'Operasional hari ini');
    setText(
      'saShiftTime',
      normalizeDisplayValue(
        operational.statusOperasional,
        'BELUM ABSEN'
      )
    );
  }
  function bindBreakOverview(breakData, operational) {
    const breakInfo = breakData || {};
    const status = normalizeDisplayValue(
      operational && operational.statusOperasional,
      'BELUM ABSEN'
    );

    const break1 = (breakInfo.break1 || {}).status || 'BELUM DIAMBIL';
    const break2 = (breakInfo.break2 || {}).status || 'BELUM DIAMBIL';
    const activeBreak =
      break1 === 'SEDANG BREAK'
        ? breakInfo.break1
        : break2 === 'SEDANG BREAK'
          ? breakInfo.break2
          : null;

    let breakText = 'Tidak sedang break.';

    if (activeBreak) {
      breakText = 'Break sedang berlangsung.';
    } else if (breakInfo.seluruhBreakSelesai) {
      breakText = 'Break 1 dan Break 2 telah selesai.';
    } else if (status === 'BELUM ABSEN') {
      breakText = 'Lakukan absen masuk sebelum memulai break.';
    } else if (status === 'SUDAH PULANG') {
      breakText = 'Aktivitas kerja hari ini telah selesai.';
    }

    setText('breakStatus', breakText);
    setText('breakCountdown', '--:--');
    setText(
      'breakCountdownLabel',
      activeBreak ? 'Status break' : 'Sisa waktu'
    );

    const completed =
      Number(break1 === 'SELESAI') +
      Number(break2 === 'SELESAI');

    setText('breakQuota', `${completed}/2`);
  }
  function bindMainActionPreview(operational, breakData) {
    const action = resolveSaAction(operational);
    const button = document.getElementById('saMainActionButton');

    if (button) {
      button.textContent = action.label;
      button.disabled =
        !action.enabled || state.isActionProcessing;
      button.dataset.actionCode = action.code;
      button.dataset.actionTarget = '';
      button.dataset.operationalStatus = action.status;
      button.setAttribute(
        'aria-label',
        action.ariaLabel || action.label
      );
      button.title = action.reason || '';
    }

    bindBreakActionState(
      action,
      breakData || (state.bootstrapData && state.bootstrapData.break) || {}
    );
  }
  function resolveSaAction(operational) {
    const source = operational || {};
    const status = normalizeOperationalStatus(
      source.statusOperasional
    );
    const backend = source.tombolUtama || {};

    const code = String(backend.aksi || 'REFRESH')
      .trim()
      .toUpperCase();

    return {
      code: code,
      status: status,
      label: normalizeDisplayValue(
        backend.label,
        'PERBARUI STATUS'
      ),
      enabled: backend.aktif !== false,
      reason: String(backend.alasan || '').trim(),
      targetTab: '',
      ariaLabel: normalizeDisplayValue(
        backend.label,
        'Perbarui status'
      )
    };
  }


  function normalizeOperationalStatus(value) {
    const canonical = String(
      value === undefined || value === null ? '' : value
    )
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    return canonical || 'BELUM ABSEN';
  }

  function isSaCheckedOut(operational) {
    const status = normalizeOperationalStatus(
      operational && operational.statusOperasional
    );

    if (status === 'SUDAH PULANG') {
      return true;
    }

    const attendance =
      state.bootstrapData && state.bootstrapData.absensiHariIni
        ? state.bootstrapData.absensiHariIni
        : {};

    const checkOutTime = String(
      attendance.jamPulang === undefined ||
      attendance.jamPulang === null
        ? ''
        : attendance.jamPulang
    ).trim();

    return Boolean(
      checkOutTime &&
      checkOutTime !== '--:--' &&
      checkOutTime !== '-:-' &&
      checkOutTime !== '-'
    );
  }

  function normalizeSaActionCode(label, status, allBreaksDone) {
    const text = String(label || '')
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, ' ')
      .replace(/\s+/g, ' ');

    if (status === 'SUDAH PULANG') {
      return 'SELESAI';
    }

    if (text.indexOf('SELESAI BREAK 1') !== -1) {
      return 'SELESAI_BREAK_1';
    }

    if (text.indexOf('SELESAI BREAK 2') !== -1) {
      return 'SELESAI_BREAK_2';
    }

    if (text.indexOf('MULAI BREAK 1') !== -1) {
      return 'MULAI_BREAK_1';
    }

    if (text.indexOf('MULAI BREAK 2') !== -1) {
      return 'MULAI_BREAK_2';
    }

    if (
      text.indexOf('ABSEN PULANG') !== -1 ||
      text.indexOf('CHECK OUT') !== -1 ||
      text.indexOf('CHECKOUT') !== -1
    ) {
      return 'ABSEN_PULANG';
    }

    if (
      text.indexOf('ABSEN MASUK') !== -1 ||
      status === 'BELUM ABSEN'
    ) {
      return 'ABSEN_MASUK';
    }

    if (status === 'BREAK 1') {
      return 'SELESAI_BREAK_1';
    }

    if (status === 'BREAK 2') {
      return 'SELESAI_BREAK_2';
    }

    if (status === 'AKTIF BEKERJA' && allBreaksDone) {
      return 'ABSEN_PULANG';
    }

    return 'MENUNGGU';
  }
  function handleSaMainActionClick() {
    if (state.isActionProcessing) {
      return;
    }

    const button = document.getElementById('saMainActionButton');

    if (!button || button.disabled) {
      return;
    }

    const actionCode = button.dataset.actionCode || '';

    if (actionCode === 'REFRESH') {
      runSaStatusRefresh();
      return;
    }

    if (actionCode === 'SELESAI') {
      return;
    }

    runSaActionWithConfirmation_(actionCode, button);
  }

  function handleBreakSessionActionClick(sessionNumber) {
    if (state.isActionProcessing) {
      return;
    }

    const button = document.getElementById(
      `breakSession${sessionNumber}Button`
    );

    if (!button || button.disabled) {
      return;
    }

    const actionCode = button.dataset.actionCode || '';
    runSaActionWithConfirmation_(actionCode, button);
  }

  /**
   * Memastikan aksi penyelesaian Break selalu melewati dialog konfirmasi.
   * Aksi lain tetap diproses langsung seperti alur sebelumnya.
   */
  function runSaActionWithConfirmation_(
    actionCode,
    sourceButton
  ) {
    const selesaiBreak = [
      'SELESAI_BREAK_1',
      'SELESAI_BREAK_2'
    ].includes(actionCode);

    if (!selesaiBreak) {
      runSaTransaction(actionCode, sourceButton);
      return;
    }

    const sessionNumber =
      actionCode === 'SELESAI_BREAK_2' ? 2 : 1;

    showSelesaiBreakConfirmation_(
      sessionNumber,
      actionCode,
      sourceButton
    );
  }

  /**
   * Menampilkan sesi, jam mulai, dan estimasi durasi berjalan.
   * Nilai pada dialog hanya informasi. Durasi final tetap dihitung server.
   */
  function showSelesaiBreakConfirmation_(
    sessionNumber,
    actionCode,
    sourceButton
  ) {
    const breakData =
      (state.bootstrapData && state.bootstrapData.break) || {};

    const session =
      breakData[`break${sessionNumber}`] || {};

    const status = String(session.status || '')
      .trim()
      .toUpperCase();

    if (status !== 'SEDANG BREAK') {
      showSaActionFeedback(
        `Status Break ${sessionNumber} sudah berubah. ` +
        'Muat ulang status sebelum melanjutkan.',
        'warning'
      );
      runSaStatusRefresh();
      return;
    }

    const jamMulai = normalizeClockValue(session.mulai);
    const durasiBerjalan =
      formatDurasiBerjalanBreak_(jamMulai);

    showGttDialog({
      title: `Konfirmasi Selesai Break ${sessionNumber}`,
      message:
        `Sesi: Break ${sessionNumber}\n` +
        `Jam mulai: ${jamMulai}\n` +
        `Durasi berjalan: ${durasiBerjalan}\n\n` +
        `Yakin ingin menyelesaikan Break ${sessionNumber} sekarang?`,
      type: 'warning',
      buttonText: 'YA, SELESAIKAN'
    });

    const actions = document.querySelector(
      '#gttDialog .gtt-dialog-actions'
    );

    const confirmButton =
      document.getElementById('gttDialogButton');

    if (!actions || !confirmButton) {
      showSaActionFeedback(
        'Dialog konfirmasi tidak dapat ditampilkan.',
        'error'
      );
      return;
    }

    const cancelButton = document.createElement('button');
    cancelButton.id = 'gttDialogCancelButton';
    cancelButton.type = 'button';
    cancelButton.textContent = 'BATAL';
    cancelButton.className = 'gtt-dialog-button';
    cancelButton.style.background = '#e7edf5';
    cancelButton.style.color = '#17304f';
    cancelButton.style.boxShadow = 'none';
    cancelButton.style.marginRight = '0';

    actions.insertBefore(cancelButton, confirmButton);

    cancelButton.addEventListener('click', () => {
      cancelButton.remove();
      confirmButton.onclick = null;
      closeGttDialog();
    });

    confirmButton.onclick = () => {
      confirmButton.onclick = null;
      cancelButton.remove();

      if (state.isActionProcessing) {
        return;
      }

      runSaTransaction(actionCode, sourceButton);
    };
  }

  /**
   * Menghitung estimasi durasi dari jam mulai terhadap jam server GTT.
   */
  function hitungDurasiBerjalanBreakDetik_(jamMulai) {
    const match = String(jamMulai || '').match(
      /^(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?$/
    );

    if (!match) {
      return null;
    }

    const jam = Number(match[1]);
    const menit = Number(match[2]);
    const detik = Number(match[3] || 0);

    if (
      jam < 0 || jam > 23 ||
      menit < 0 || menit > 59 ||
      detik < 0 || detik > 59
    ) {
      return null;
    }

    const sekarang = new Date(
      Date.now() + state.serverClockOffsetMs
    );

    const options = {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hourCycle: 'h23'
    };

    if (state.serverTimeZone) {
      options.timeZone = state.serverTimeZone;
    }

    const parts = new Intl.DateTimeFormat(
      'en-GB',
      options
    ).formatToParts(sekarang);

    const map = {};
    parts.forEach(part => {
      if (part.type !== 'literal') {
        map[part.type] = Number(part.value);
      }
    });

    const mulaiDetik =
      jam * 3600 + menit * 60 + detik;

    const sekarangDetik =
      map.hour * 3600 + map.minute * 60 + map.second;

    let selisih = sekarangDetik - mulaiDetik;

    if (selisih < 0) {
      selisih += 24 * 3600;
    }

    return Math.max(0, selisih);
  }

  function formatDurasiBerjalanBreak_(jamMulai) {
    const totalDetik =
      hitungDurasiBerjalanBreakDetik_(jamMulai);

    if (totalDetik === null) {
      return 'Tidak tersedia';
    }

    const jam = Math.floor(totalDetik / 3600);
    const menit = Math.floor((totalDetik % 3600) / 60);
    const detik = totalDetik % 60;

    if (jam > 0) {
      return `${jam} jam ${menit} menit`;
    }

    return `${menit} menit ${detik} detik`;
  }

  function runSaTransaction(actionCode, sourceButton) {
    if (
      state.isActionProcessing ||
      !isSaSessionActive()
    ) {
      return;
    }

    if (!navigator.onLine) {
      showSaActionFeedback(
        'Tidak ada koneksi internet.',
        'error'
      );
      return;
    }

    if (
      typeof google === 'undefined' ||
      !google.script ||
      !google.script.run
    ) {
      showSaActionFeedback(
        'Aplikasi harus dibuka melalui URL Web App.',
        'error'
      );
      return;
    }

    const supportedActions = [
      'ABSEN_MASUK',
      'MULAI_BREAK_1',
      'SELESAI_BREAK_1',
      'MULAI_BREAK_2',
      'SELESAI_BREAK_2',
      'ABSEN_PULANG'
    ];

    if (!supportedActions.includes(actionCode)) {
      showSaActionFeedback(
        'Aksi tidak dikenali. Muat ulang status aplikasi.',
        'error'
      );
      runSaStatusRefresh();
      return;
    }

    setSaActionProcessing(true, actionCode, sourceButton);

    const runner = google.script.run
      .withSuccessHandler(result => {
        handleSaTransactionSuccess(actionCode, result);
      })
      .withFailureHandler(error => {
        handleSaTransactionFailure(actionCode, error);
      });

    switch (actionCode) {
      case 'ABSEN_MASUK':
        runner.apiAbsenMasuk(state.pin);
        break;

      case 'MULAI_BREAK_1':
        runner.apiMulaiBreak1(state.pin);
        break;

      case 'SELESAI_BREAK_1':
        runner.apiSelesaiBreak1(state.pin);
        break;

      case 'MULAI_BREAK_2':
        runner.apiMulaiBreak2(state.pin);
        break;

      case 'SELESAI_BREAK_2':
        runner.apiSelesaiBreak2(state.pin);
        break;

      case 'ABSEN_PULANG':
        runner.apiAbsenPulang(state.pin);
        break;
    }
  }

  function handleSaTransactionSuccess(actionCode, result) {
    if (!result || result.success !== true) {
      setSaActionProcessing(false);

      showSaActionFeedback(
        result && result.message
          ? result.message
          : 'Transaksi gagal diproses.',
        'error'
      );
      return;
    }

    showSaActionFeedback(
      result.message || buildSaActionSuccessMessage(actionCode),
      'success'
    );

    reloadSaDashboardAfterTransaction();
  }

  function handleSaTransactionFailure(actionCode, error) {
    console.error(`Transaksi ${actionCode} gagal:`, error);
    setSaActionProcessing(false);

    showSaActionFeedback(
      error && error.message
        ? `Terjadi kesalahan sistem: ${error.message}`
        : 'Server tidak dapat memproses transaksi.',
      'error'
    );
  }
  function reloadSaDashboardAfterTransaction() {
    google.script.run
      .withSuccessHandler(result => {
        setSaActionProcessing(false);

        if (!result || result.success !== true || !result.data) {
          showSaActionFeedback(
            'Transaksi berhasil, tetapi status terbaru gagal dimuat. Dashboard akan mencoba memperbarui otomatis.',
            'warning'
          );
          runSaStatusRefresh();
          return;
        }

        state.bootstrapData = result.data;
        state.user = mergeBootstrapUserData(
          state.user,
          result.data.pengguna
        );
        configureServerClock(result.data.waktuServer);
        refreshSaDashboardView();
      })
      .withFailureHandler(error => {
        console.error('Reload dashboard pascatransaksi gagal:', error);
        setSaActionProcessing(false);
        runSaStatusRefresh();
      })
      .apiRefreshStatusSA(state.pin);
  }

  function setSaActionProcessing(
    isProcessing,
    actionCode,
    sourceButton
  ) {
    state.isActionProcessing = isProcessing;
    state.activeActionCode = isProcessing ? actionCode || '' : '';

    if (isProcessing && sourceButton) {
      state.actionButtonOriginalLabel =
        sourceButton.textContent || '';
      sourceButton.textContent = 'MEMPROSES...';
    } else {
      state.actionButtonOriginalLabel = '';
    }

    // Seluruh tombol transaksi dikunci selama satu request berjalan,
    // mencegah klik ganda dan transaksi paralel.
    bindMainActionPreview(
      (state.bootstrapData && state.bootstrapData.operasional) || {},
      (state.bootstrapData && state.bootstrapData.break) || {}
    );
  }

  function showGttDialog(options) {
    initializeGttDialog();

    // Bersihkan tombol sekunder/handler dari dialog konfirmasi sebelumnya.
    const oldCancel = document.getElementById(
      'gttDialogCancelButton'
    );
    if (oldCancel) {
      oldCancel.remove();
    }

    const oldPrimary = document.getElementById('gttDialogButton');
    if (oldPrimary) {
      oldPrimary.onclick = null;
    }

    const config = options || {};
    const type = ['error', 'warning', 'success'].includes(config.type)
      ? config.type
      : 'warning';

    const overlay = document.getElementById('gttDialogOverlay');
    const dialog = document.getElementById('gttDialog');
    const title = document.getElementById('gttDialogTitle');
    const message = document.getElementById('gttDialogMessage');
    const icon = document.getElementById('gttDialogIcon');
    const button = document.getElementById('gttDialogButton');

    if (!overlay || !dialog || !title || !message || !button) {
      console.error('Komponen dialog GTT tidak tersedia.');
      return;
    }

    const icons = {
      error: '×',
      warning: '!',
      success: '✓'
    };

    dialog.classList.remove('error', 'warning', 'success');
    dialog.classList.add(type);

    title.textContent = config.title || 'Perhatian';
    message.textContent = String(config.message || '').trim();
    button.textContent = config.buttonText || 'MENGERTI';

    if (icon) {
      icon.textContent = icons[type];
    }

    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    window.setTimeout(() => button.focus(), 0);
  }

  function closeGttDialog() {
    const overlay = document.getElementById('gttDialogOverlay');

    if (!overlay) {
      return;
    }

    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function buildSaActionSuccessMessage(actionCode) {
    const messages = {
      ABSEN_MASUK: 'Absen masuk berhasil dicatat.',
      MULAI_BREAK_1: 'Break 1 berhasil dimulai.',
      SELESAI_BREAK_1: 'Break 1 berhasil diselesaikan.',
      MULAI_BREAK_2: 'Break 2 berhasil dimulai.',
      SELESAI_BREAK_2: 'Break 2 berhasil diselesaikan.',
      ABSEN_PULANG: 'Absen pulang berhasil dicatat.'
    };

    return messages[actionCode] || 'Transaksi berhasil.';
  }

  function focusBreakActionButton(actionCode) {
    const sessionNumber =
      actionCode.indexOf('BREAK_2') !== -1 ? 2 : 1;

    const button = document.getElementById(
      `breakSession${sessionNumber}Button`
    );

    if (!button) {
      return;
    }

    window.setTimeout(() => {
      button.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
      button.focus({ preventScroll: true });

  }
  function bindBreakActionState(action, breakData) {
    const source = breakData || {};
    const break1 = (source.break1 || {}).status || 'BELUM DIAMBIL';
    const break2 = (source.break2 || {}).status || 'BELUM DIAMBIL';

    renderBreakSessionState(1, {
      done: break1 === 'SELESAI',
      active: break1 === 'SEDANG BREAK',
      available: action.code === 'MULAI_BREAK_1' && action.enabled,
      blockedByCapacity:
        action.code === 'MULAI_BREAK_1' && !action.enabled,
      actionCode:
        break1 === 'SEDANG BREAK'
          ? 'SELESAI_BREAK_1'
          : 'MULAI_BREAK_1'
    });

    renderBreakSessionState(2, {
      done: break2 === 'SELESAI',
      active: break2 === 'SEDANG BREAK',
      available: action.code === 'MULAI_BREAK_2' && action.enabled,
      blockedByCapacity:
        action.code === 'MULAI_BREAK_2' && !action.enabled,
      actionCode:
        break2 === 'SEDANG BREAK'
          ? 'SELESAI_BREAK_2'
          : 'MULAI_BREAK_2'
    });

    setText(
      'breakRuleMessage',
      buildBreakRuleMessage(action, source)
    );
  }

  function renderBreakSessionState(sessionNumber, config) {
    const card = document.getElementById(
      `breakSession${sessionNumber}Card`
    );
    const statusElement = document.getElementById(
      `breakSession${sessionNumber}Status`
    );
    const badge = document.getElementById(
      `breakSession${sessionNumber}Badge`
    );
    const button = document.getElementById(
      `breakSession${sessionNumber}Button`
    );

    const stateName = config.done
      ? 'done'
      : config.active
        ? 'active'
        : config.available
          ? 'available'
          : 'locked';

    const labels = {
      done: ['Selesai', 'Selesai'],
      active: ['Sedang berlangsung', 'Aktif'],
      available: ['Belum dimulai', 'Tersedia'],
      locked: ['Terkunci', 'Terkunci']
    };

    if (statusElement) {
      statusElement.textContent = labels[stateName][0];
    }

    if (badge) {
      badge.textContent = labels[stateName][1];
    }

    if (card) {
      card.classList.remove(
        'session-available',
        'session-active',
        'session-completed',
        'session-locked'
      );

      card.classList.add(
        stateName === 'done'
          ? 'session-completed'
          : `session-${stateName}`
      );
    }

    if (button) {
      button.textContent = config.active
        ? `Selesai Break ${sessionNumber}`
        : config.done
          ? `Break ${sessionNumber} Selesai`
          : `Mulai Break ${sessionNumber}`;

      button.disabled =
        state.isActionProcessing ||
        config.done ||
        (!config.active && !config.available);
      button.dataset.actionCode = config.actionCode;
    }
  }
  function buildBreakRuleMessage(action, breakData) {
    if (action.reason) {
      return action.reason;
    }

    const messages = {
      ABSEN_MASUK: 'Lakukan absen masuk sebelum memulai break.',
      MULAI_BREAK_1: 'Break 1 tersedia dan siap dimulai.',
      SELESAI_BREAK_1: 'Selesaikan Break 1 sebelum melanjutkan aktivitas kerja.',
      MULAI_BREAK_2: 'Break 1 selesai. Break 2 sekarang tersedia.',
      SELESAI_BREAK_2: 'Selesaikan Break 2 sebelum absen pulang.',
      ABSEN_PULANG: 'Break 1 dan Break 2 selesai. Anda dapat melakukan absen pulang.',
      SELESAI: 'Aktivitas kerja hari ini telah selesai.'
    };

    if (breakData && breakData.kapasitasPenuh) {
      return breakData.warningKapasitas ||
        'Kapasitas break sedang penuh. Silakan mencoba kembali.';
    }

    return messages[action.code] || 'Status break sedang diperbarui.';
  }

  function buildAttendanceBadge(attendanceStatus, operationalStatus) {
    if (operationalStatus === 'SUDAH PULANG') {
      return 'Selesai';
    }

    if (operationalStatus.indexOf('BREAK') !== -1) {
      return 'Break';
    }

    if (attendanceStatus === 'BELUM ABSEN') {
      return 'Menunggu';
    }

    if (attendanceStatus.indexOf('HADIR') !== -1) {
      return 'Hadir';
    }

    return formatStatusLabel(attendanceStatus);
  }

  function setAttendanceBadgeClass(
    attendanceStatus,
    operationalStatus
  ) {
    const badge =
      document.getElementById('attendanceStatusBadge');

    if (!badge) {
      return;
    }

    badge.classList.remove(
      'status-neutral',
      'status-success',
      'status-warning',
      'status-danger'
    );

    let className = 'status-neutral';

    if (
      operationalStatus === 'SUDAH PULANG' ||
      attendanceStatus.indexOf('HADIR') !== -1
    ) {
      className = 'status-success';
    } else if (
      operationalStatus.indexOf('BREAK') !== -1 ||
      attendanceStatus.indexOf('TERLAMBAT') !== -1
    ) {
      className = 'status-warning';
    } else if (
      attendanceStatus === 'ALPA' ||
      attendanceStatus === 'TIDAK HADIR'
    ) {
      className = 'status-danger';
    }

    badge.classList.add(className);
  }

  function buildAttendanceMessage(attendance, operationalStatus) {
    if (operationalStatus === 'SUDAH PULANG') {
      return attendance.jamPulang
        ? `Absen pulang tercatat pukul ${attendance.jamPulang}.`
        : 'Aktivitas kerja hari ini telah selesai.';
    }

    if (operationalStatus.indexOf('BREAK') !== -1) {
      return 'Break sedang berlangsung.';
    }

    if (attendance.jamMasuk) {
      const lateMinutes = toSafeNumber(attendance.terlambatMenit);

      if (lateMinutes > 0) {
        return `Absen masuk tercatat pukul ${attendance.jamMasuk}. Terlambat ${lateMinutes} menit.`;
      }

      return `Absen masuk tercatat pukul ${attendance.jamMasuk}.`;
    }

    return 'Silakan melakukan absen masuk.';
  }

  function formatStatusLabel(value) {
    const normalized = normalizeDisplayValue(value, '-');

    return normalized
      .toLowerCase()
      .replace(/\b\w/g, character => character.toUpperCase());
  }

  function normalizeDisplayValue(value, fallback) {
    const normalized = String(
      value === undefined || value === null ? '' : value
    )
      .trim()
      .toUpperCase();

    return normalized || fallback;
  }

  function normalizeClockValue(value) {
    const normalized = String(
      value === undefined || value === null ? '' : value
    ).trim();

    return normalized || '--:--';
  }

  function toSafeNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
  }

  function openSaTab(tabName) {
    const tabMap = {
      home: 'saHomeView',
      break: 'saBreakView',
      outside: 'saOutsideDutyView',
      activity: 'saActivityView',
      profile: 'saProfileView'
    };

    const targetId = tabMap[tabName] || tabMap.home;

    document.querySelectorAll('.sa-tab-view').forEach(view => {
      view.classList.toggle('active', view.id === targetId);
    });

    document.querySelectorAll('[data-sa-tab]').forEach(button => {
      const active = button.dataset.saTab === (tabName || 'home');
      button.classList.toggle('active', active);
      if (active) {
        button.setAttribute('aria-current', 'page');
      } else {
        button.removeAttribute('aria-current');
      }
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function populateAdminDashboard(user) {
    setText('adminName', user.name);

    setText(
      'adminProfile',
      `${user.position} · Outlet ${user.outlet}`
    );
  }

  function showPage(pageId) {
    PAGE_IDS.forEach(id => {
      const page = document.getElementById(id);

      if (page) {
        page.classList.toggle('active', id === pageId);
      }
    });

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }

  function logout() {
    stopSaAutoRefresh();

    state.user = null;
    state.pin = '';
    state.bootstrapData = null;
    state.isBootstrapProcessing = false;
    state.isRefreshProcessing = false;
    state.isActionProcessing = false;
    state.lastRefreshAt = 0;
    state.refreshFailureCount = 0;
    state.serverClockOffsetMs = 0;
    state.serverTimeZone = '';
    state.activeActionCode = '';
    state.actionButtonOriginalLabel = '';

    openSaTab('home');
    resetLoginForm();
    showPage('loginPage');

    setTimeout(() => {
      const pinInput = document.getElementById('pinInput');

      if (pinInput) {
        pinInput.focus();
      }
    }, 100);
  }

  function resetLoginForm() {
    const pinInput = document.getElementById('pinInput');

    if (pinInput) {
      pinInput.value = '';
      pinInput.type = 'password';
    }

    const toggleButton =
      document.getElementById('togglePinButton');

    if (toggleButton) {
      toggleButton.textContent = 'Lihat';
    }

    setLoginProcessing(false);
    clearLoginMessage();
    updateLoginButton();
  }

  function clearPinInput() {
    const pinInput = document.getElementById('pinInput');

    if (pinInput) {
      pinInput.value = '';
      pinInput.focus();
    }

    updateLoginButton();
  }

  function setLoginProcessing(isProcessing) {
    state.isLoginProcessing = isProcessing;

    const loginButton =
      document.getElementById('loginButton');

    if (!loginButton) {
      return;
    }

    loginButton.textContent =
      isProcessing ? 'Memproses...' : 'Masuk';

    updateLoginButton();
  }

  function togglePinVisibility() {
    const pinInput = document.getElementById('pinInput');
    const button =
      document.getElementById('togglePinButton');

    if (!pinInput || !button) {
      return;
    }

    const currentlyHidden =
      pinInput.type === 'password';

    pinInput.type =
      currentlyHidden ? 'text' : 'password';

    button.textContent =
      currentlyHidden ? 'Sembunyi' : 'Lihat';
  }

  function updateInternetStatus() {
    const online = navigator.onLine;

    state.online = online;

    const indicator =
      document.getElementById('internetIndicator');

    const status =
      document.getElementById('internetStatus');

    if (indicator) {
      indicator.classList.remove(
        'online',
        'offline',
        'checking'
      );

      indicator.classList.add(
        online ? 'online' : 'offline'
      );
    }

    if (status) {
      status.textContent =
        online ? 'Terhubung' : 'Tidak terhubung';
    }

    updateLoginButton();
  }

  function requestLocation() {
    const indicator =
      document.getElementById('locationIndicator');

    const status =
      document.getElementById('locationStatus');

    if (!navigator.geolocation) {
      setLocationStatus(
        indicator,
        status,
        'invalid',
        'Perangkat tidak mendukung lokasi'
      );
      return;
    }

    setLocationStatus(
      indicator,
      status,
      'checking',
      'Memeriksa izin lokasi...'
    );

    navigator.geolocation.getCurrentPosition(
      position => {
        state.location = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        };

        setLocationStatus(
          indicator,
          status,
          'valid',
          `Lokasi tersedia · akurasi ±${Math.round(
            position.coords.accuracy
          )} m`
        );
      },

      error => {
        state.location = null;

        setLocationStatus(
          indicator,
          status,
          'invalid',
          getLocationErrorMessage(error)
        );
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }

  function setLocationStatus(
    indicator,
    status,
    className,
    message
  ) {
    if (indicator) {
      indicator.classList.remove(
        'checking',
        'valid',
        'invalid'
      );

      indicator.classList.add(className);
    }

    if (status) {
      status.textContent = message;
    }
  }

  function getLocationErrorMessage(error) {
    switch (error.code) {
      case error.PERMISSION_DENIED:
        return 'Izin lokasi ditolak';

      case error.POSITION_UNAVAILABLE:
        return 'Lokasi tidak tersedia';

      case error.TIMEOUT:
        return 'Pemeriksaan lokasi terlalu lama';

      default:
        return 'Lokasi gagal diperiksa';
    }
  }

  function startClock() {
    updateClock();
    setInterval(updateClock, 1000);
  }

  function configureServerClock(serverTime) {
    const source = serverTime || {};
    const timestamp = Number(source.timestamp);

    state.serverClockOffsetMs =
      Number.isFinite(timestamp)
        ? timestamp - Date.now()
        : 0;

    state.serverTimeZone =
      String(source.zonaWaktu || '').trim();

    updateClock();
  }

  function updateClock() {
    const now = new Date(
      Date.now() + state.serverClockOffsetMs
    );

    const formatOptions = state.serverTimeZone
      ? { timeZone: state.serverTimeZone }
      : {};

    const dateText = new Intl.DateTimeFormat(
      'id-ID',
      {
        ...formatOptions,
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      }
    ).format(now);

    const timeText = new Intl.DateTimeFormat(
      'id-ID',
      {
        ...formatOptions,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }
    )
      .format(now)
      .replace(/\./g, ':');

    // Perbarui kedua tampilan jam. Dashboard baru memakai elemen header,
    // sedangkan elemen legacy tetap dipertahankan untuk kompatibilitas.
    setText('currentDate', dateText);
    setText('currentTime', timeText);
    setText('headerCurrentDate', dateText);
    setText('headerCurrentTime', timeText);
  }

  function showLoginMessage(message, type) {
    const element =
      document.getElementById('loginMessage');

    if (!element) {
      return;
    }

    element.textContent = message;
    element.className = `system-message ${type}`;
  }

  function clearLoginMessage() {
    const element =
      document.getElementById('loginMessage');

    if (!element) {
      return;
    }

    element.textContent = '';
    element.className = 'system-message';
  }

  function setText(elementId, value) {
    const element = document.getElementById(elementId);

    if (element) {
      element.textContent = value;
    }
  }

  // ===== UI v2.1 (digabung dari file aktif lama) =====
/**
   * GTT Frontend UI v2.1
   * Modul kecil untuk tombol PULANG pada header Dashboard SA.
   * Dimuat setelah file Scripts utama agar tidak perlu mengganti script panjang.
   */
  (() => {
    const originalBindMainActionPreview = bindMainActionPreview;

    bindMainActionPreview = function (operational, breakData) {
      originalBindMainActionPreview(operational, breakData);
      updateHeaderPulangButton(operational, breakData);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('saPulangButton');

      if (!button) {
        return;
      }

      button.addEventListener('click', handleHeaderPulangClick);
      updateHeaderPulangButton({}, {});
    });

    function handleHeaderPulangClick() {
      if (state.isActionProcessing) {
        return;
      }

      if (!isSaSessionActive()) {
        showHeaderPulangDialog(
          'Sesi Belum Aktif',
          'Silakan login kembali sebelum melakukan absen pulang.',
          'warning'
        );
        return;
      }

      const payload = state.bootstrapData || {};
      const operational = payload.operasional || {};
      const breakData = payload.break || {};
      const status = normalizeOperationalStatus(
        operational.statusOperasional
      );
      const break1 = getBreakStatus(breakData, 1);
      const break2 = getBreakStatus(breakData, 2);

      if (status === 'SUDAH PULANG' || isSaCheckedOut(operational)) {
        showHeaderPulangDialog(
          'Absen Pulang Sudah Tercatat',
          'Aktivitas kerja hari ini sudah selesai.',
          'success'
        );
        return;
      }

      if (status === 'BELUM ABSEN') {
        showHeaderPulangDialog(
          'Belum Bisa Pulang',
          'Lakukan absen masuk terlebih dahulu.',
          'warning'
        );
        return;
      }

      if (break1 === 'SEDANG BREAK') {
        showHeaderPulangDialog(
          'Break 1 Masih Berlangsung',
          'Akhiri Break 1 terlebih dahulu sebelum melakukan absen pulang.',
          'warning'
        );
        return;
      }

      if (break2 === 'SEDANG BREAK') {
        showHeaderPulangDialog(
          'Break 2 Masih Berlangsung',
          'Akhiri Break 2 terlebih dahulu sebelum melakukan absen pulang.',
          'warning'
        );
        return;
      }

      // Break yang BELUM DIAMBIL bukan break aktif dan tidak boleh
      // menghalangi absen pulang. Pengguna cukup mengonfirmasi pulang.
      showPulangConfirmation(getCurrentDeviceClock());
    }

    function updateHeaderPulangButton(operational, breakData) {
      const button = document.getElementById('saPulangButton');

      if (!button) {
        return;
      }

      const source = operational || {};
      const breaks = breakData || {};
      const status = normalizeOperationalStatus(
        source.statusOperasional
      );
      const checkedOut =
        status === 'SUDAH PULANG' || isSaCheckedOut(source);
      const hasActiveBreak =
        getBreakStatus(breaks, 1) === 'SEDANG BREAK' ||
        getBreakStatus(breaks, 2) === 'SEDANG BREAK';

      button.classList.toggle(
        'is-ready',
        !hasActiveBreak && !checkedOut && !state.isActionProcessing
      );

      if (state.isActionProcessing) {
        button.textContent = 'MEMPROSES...';
        button.disabled = true;
        button.setAttribute('aria-label', 'Sedang memproses transaksi');
        return;
      }

      button.textContent = checkedOut ? 'SELESAI' : 'PULANG';
      button.disabled = checkedOut;
      button.setAttribute(
        'aria-label',
        checkedOut ? 'Absen pulang sudah tercatat' : 'Absen pulang'
      );
      button.title = checkedOut
        ? 'Absen pulang sudah tercatat'
        : !hasActiveBreak
          ? 'Siap melakukan absen pulang'
          : 'Akhiri break yang sedang berlangsung terlebih dahulu';
    }

    function getBreakStatus(breakData, sessionNumber) {
      const session =
        (breakData && breakData[`break${sessionNumber}`]) || {};

      return String(session.status || 'BELUM DIAMBIL')
        .trim()
        .toUpperCase();
    }

    function showHeaderPulangDialog(title, message, type) {
      const oldCancel = document.getElementById(
        'gttDialogCancelButton'
      );
      if (oldCancel) {
        oldCancel.remove();
      }

      const oldPrimary = document.getElementById('gttDialogButton');
      if (oldPrimary) {
        oldPrimary.onclick = null;
      }

      showGttDialog({
        title: title,
        message: message,
        type: type,
        buttonText: 'MENGERTI'
      });
    }

    function getCurrentDeviceClock() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(
        now.getMinutes()
      ).padStart(2, '0')}`;
    }

    function showPulangConfirmation(clockText) {
      showGttDialog({
        title: 'Konfirmasi Pulang',
        message: `Apakah Anda akan mengakhiri pekerjaan dan pulang pukul ${clockText}?`,
        type: 'warning',
        buttonText: 'YA, PULANG'
      });

      const actions = document.querySelector(
        '#gttDialog .gtt-dialog-actions'
      );
      const confirmButton = document.getElementById('gttDialogButton');

      if (!actions || !confirmButton) {
        return;
      }

      const oldCancel = document.getElementById(
        'gttDialogCancelButton'
      );
      if (oldCancel) {
        oldCancel.remove();
      }

      const cancelButton = document.createElement('button');
      cancelButton.id = 'gttDialogCancelButton';
      cancelButton.type = 'button';
      cancelButton.textContent = 'BATAL';
      cancelButton.className = 'gtt-dialog-button';
      cancelButton.style.background = '#e7edf5';
      cancelButton.style.color = '#17304f';
      cancelButton.style.boxShadow = 'none';
      cancelButton.style.marginRight = '0';
      actions.insertBefore(cancelButton, confirmButton);

      cancelButton.addEventListener('click', () => {
        cancelButton.remove();
        confirmButton.onclick = null;
        closeGttDialog();
      });

      confirmButton.onclick = () => {
        const currentTitle = document.getElementById(
          'gttDialogTitle'
        );
        confirmButton.onclick = null;

        if (
          !currentTitle ||
          currentTitle.textContent !== 'Konfirmasi Pulang'
        ) {
          return;
        }

        cancelButton.remove();
        const button = document.getElementById('saPulangButton');
        runSaTransaction('ABSEN_PULANG', button);
      };
    }
  })();
</script>
